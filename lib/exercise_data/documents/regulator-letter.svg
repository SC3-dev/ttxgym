<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img">
<rect x="0" y="0" width="1200" height="750" fill="#5b6170"/><rect x="150" y="26" width="900" height="698" fill="#ffffff" rx="4"/><g transform="translate(150,26)"><rect x="56" y="48" width="210" height="46" fill="#141820" rx="3"/><text x="70" y="79" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="20" fill="#ffffff" font-weight="700">[REGULATOR]</text><text x="844" y="68" font-family="'DM Mono','SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#5a6373" text-anchor="end">Ref: ENQ/2291/A</text><text x="844" y="92" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#5a6373" text-anchor="end">[date]</text><line x1="56" y1="124" x2="844" y2="124" stroke="#141820" stroke-width="2"/><text x="56" y="178" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#141820" font-weight="700">Personal data breach — request for information</text><text x="56" y="232" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="18" fill="#141820">We have received a notification of a personal data breach from</text><text x="56" y="260" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="18" fill="#141820">your organisation. We are making initial enquiries.</text><text x="56" y="312" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="18" fill="#141820" font-weight="600">Please provide the following within 72 hours of this letter:</text><circle cx="70" cy="352" r="4" fill="#141820"/><text x="92" y="358" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="17" fill="#141820">the categories and approximate number of data subjects affected</text><circle cx="70" cy="390" r="4" fill="#141820"/><text x="92" y="396" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="17" fill="#141820">the categories and approximate volume of personal data records</text><circle cx="70" cy="428" r="4" fill="#141820"/><text x="92" y="434" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="17" fill="#141820">the likely consequences for the individuals concerned</text><circle cx="70" cy="466" r="4" fill="#141820"/><text x="92" y="472" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="17" fill="#141820">the measures taken, or proposed, to address the breach</text><circle cx="70" cy="504" r="4" fill="#141820"/><text x="92" y="510" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="17" fill="#141820">the name and contact details of your data protection officer</text><text x="56" y="570" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#5a6373">Failure to respond may be taken into account in any subsequent</text><text x="56" y="594" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#5a6373">regulatory action.</text><text x="56" y="656" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#141820">Case officer  ·  Investigations team</text></g>
</svg>
