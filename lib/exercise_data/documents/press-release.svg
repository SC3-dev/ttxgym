<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img">
<rect x="0" y="0" width="1200" height="750" fill="#5b6170"/><rect x="150" y="26" width="900" height="698" fill="#ffffff" rx="4"/><g transform="translate(150,26)"><text x="56" y="78" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#2e7de0" font-weight="700">PRESS RELEASE</text><text x="56" y="92" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" fill="#e8ecf2"></text><line x1="56" y1="100" x2="844" y2="100" stroke="#e2e7ef" stroke-width="2"/><text x="56" y="152" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="32" fill="#141820" font-weight="700">Statement on a cyber security incident</text><text x="56" y="188" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#5a6373">For immediate release  ·  [date]  ·  [organisation]</text><text x="56" y="244" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" fill="#141820">We are responding to a cyber security incident affecting some of</text><text x="56" y="274" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" fill="#141820">our systems. We identified the issue in the early hours of this</text><text x="56" y="304" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" fill="#141820">morning and took immediate steps to contain it.</text><text x="56" y="356" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" fill="#141820">Some services are currently unavailable while we work to restore</text><text x="56" y="386" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" fill="#141820">them safely. We are sorry for the disruption this is causing.</text><text x="56" y="438" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" fill="#141820">We are working with external specialists and have notified the</text><text x="56" y="468" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" fill="#141820">relevant authorities. Our investigation is ongoing.</text><text x="56" y="520" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" fill="#141820" font-weight="600">We will provide a further update by [time].</text><line x1="56" y1="566" x2="844" y2="566" stroke="#e2e7ef" stroke-width="2"/><text x="56" y="604" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#141820" font-weight="700">Media enquiries</text><text x="56" y="632" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#5a6373">press@[organisation]  ·  [telephone]</text><text x="844" y="632" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#8b93a3" font-weight="700" text-anchor="end">ENDS</text></g>
</svg>
