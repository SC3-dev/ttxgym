<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img">
<rect x="0" y="0" width="1200" height="750" fill="#11141c"/><text x="600" y="62" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#e8ecf2" font-weight="700" text-anchor="middle">Escalation path</text><text x="600" y="92" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#8b93a3" text-anchor="middle">Who is told, in what order, and what each of them decides</text><rect x="200" y="140" width="800" height="84" fill="#1b212c" rx="10" stroke="#5e6676" stroke-width="2"/><rect x="200" y="140" width="10" height="84" fill="#5e6676" rx="4"/><text x="240" y="178" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#e8ecf2" font-weight="700">Whoever notices</text><text x="240" y="206" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#8b93a3">Anyone — service desk, a user, a supplier</text><text x="960" y="190" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="30" fill="#5e6676" font-weight="700" text-anchor="end" opacity="0.4">1</text><path d="M600 224 v18 m-9 -9 l9 9 l9 -9" stroke="#3a4557" stroke-width="2" fill="none"/><rect x="200" y="252" width="800" height="84" fill="#1b212c" rx="10" stroke="#2e7de0" stroke-width="2"/><rect x="200" y="252" width="10" height="84" fill="#2e7de0" rx="4"/><text x="240" y="290" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#e8ecf2" font-weight="700">On-call engineer</text><text x="240" y="318" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#8b93a3">Confirms, contains, records</text><text x="960" y="302" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="30" fill="#2e7de0" font-weight="700" text-anchor="end" opacity="0.4">2</text><path d="M600 336 v18 m-9 -9 l9 9 l9 -9" stroke="#3a4557" stroke-width="2" fill="none"/><rect x="200" y="364" width="800" height="84" fill="#1b212c" rx="10" stroke="#2e7de0" stroke-width="2"/><rect x="200" y="364" width="10" height="84" fill="#2e7de0" rx="4"/><text x="240" y="402" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#e8ecf2" font-weight="700">Incident manager</text><text x="240" y="430" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#8b93a3">Owns the response, calls the severity</text><text x="960" y="414" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="30" fill="#2e7de0" font-weight="700" text-anchor="end" opacity="0.4">3</text><path d="M600 448 v18 m-9 -9 l9 9 l9 -9" stroke="#3a4557" stroke-width="2" fill="none"/><rect x="200" y="476" width="800" height="84" fill="#1b212c" rx="10" stroke="#f5a623" stroke-width="2"/><rect x="200" y="476" width="10" height="84" fill="#f5a623" rx="4"/><text x="240" y="514" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#e8ecf2" font-weight="700">Executive</text><text x="240" y="542" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#8b93a3">Decides on disclosure, payment, shutdown</text><text x="960" y="526" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="30" fill="#f5a623" font-weight="700" text-anchor="end" opacity="0.4">4</text><path d="M600 560 v18 m-9 -9 l9 9 l9 -9" stroke="#3a4557" stroke-width="2" fill="none"/><rect x="200" y="588" width="800" height="84" fill="#1b212c" rx="10" stroke="#e05252" stroke-width="2"/><rect x="200" y="588" width="10" height="84" fill="#e05252" rx="4"/><text x="240" y="626" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#e8ecf2" font-weight="700">Board &amp; regulator</text><text x="240" y="654" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#8b93a3">Notified within statutory deadlines</text><text x="960" y="638" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="30" fill="#e05252" font-weight="700" text-anchor="end" opacity="0.4">5</text>
</svg>
