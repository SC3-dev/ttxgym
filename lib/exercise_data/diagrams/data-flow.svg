<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img">
<rect x="0" y="0" width="1200" height="750" fill="#11141c"/><text x="600" y="58" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#e8ecf2" font-weight="700" text-anchor="middle">Where the data goes</text><text x="600" y="88" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#8b93a3" text-anchor="middle">Useful for working out who has to be told</text><rect x="80" y="180" width="240" height="90" fill="#1b212c" rx="8" stroke="#3ec9c8" stroke-width="2"/><text x="200" y="223" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" fill="#e8ecf2" font-weight="600" text-anchor="middle">Customers</text><text x="200" y="249" font-family="'DM Mono','SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#8b93a3" text-anchor="middle">personal data</text><rect x="480" y="180" width="240" height="90" fill="#1b212c" rx="8" stroke="#2e7de0" stroke-width="2"/><text x="600" y="223" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" fill="#e8ecf2" font-weight="600" text-anchor="middle">Your application</text><text x="600" y="249" font-family="'DM Mono','SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#8b93a3" text-anchor="middle">processing</text><rect x="880" y="180" width="240" height="90" fill="#1b212c" rx="8" stroke="#3ec9c8" stroke-width="2"/><text x="1000" y="223" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" fill="#e8ecf2" font-weight="600" text-anchor="middle">Payment provider</text><text x="1000" y="249" font-family="'DM Mono','SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#8b93a3" text-anchor="middle">card data</text><rect x="480" y="380" width="240" height="90" fill="#1b212c" rx="8" stroke="#2e7de0" stroke-width="2"/><text x="600" y="423" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" fill="#e8ecf2" font-weight="600" text-anchor="middle">Database</text><text x="600" y="449" font-family="'DM Mono','SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#8b93a3" text-anchor="middle">at rest</text><rect x="80" y="380" width="240" height="90" fill="#1b212c" rx="8" stroke="#e05252" stroke-width="2"/><text x="200" y="423" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" fill="#e8ecf2" font-weight="600" text-anchor="middle">Analytics supplier</text><text x="200" y="449" font-family="'DM Mono','SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#8b93a3" text-anchor="middle">third country</text><rect x="880" y="380" width="240" height="90" fill="#1b212c" rx="8" stroke="#2e7de0" stroke-width="2"/><text x="1000" y="423" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" fill="#e8ecf2" font-weight="600" text-anchor="middle">Backup store</text><text x="1000" y="449" font-family="'DM Mono','SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#8b93a3" text-anchor="middle">retained 90 days</text><rect x="480" y="570" width="240" height="90" fill="#1b212c" rx="8" stroke="#f5a623" stroke-width="2"/><text x="600" y="613" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" fill="#e8ecf2" font-weight="600" text-anchor="middle">Archive</text><text x="600" y="639" font-family="'DM Mono','SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#8b93a3" text-anchor="middle">offline, 7 years</text><g stroke="#3a4557" stroke-width="2" fill="none"><path d="M320 225 H480" marker-end="url(#a)"/><path d="M720 225 H880" marker-end="url(#a)"/><path d="M600 270 V380" marker-end="url(#a)"/><path d="M480 425 H320" marker-end="url(#a)"/><path d="M720 425 H880" marker-end="url(#a)"/><path d="M600 470 V570" marker-end="url(#a)"/></g><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#3a4557"/></marker></defs><rect x="80" y="680" width="1040" height="44" fill="#1b212c" rx="8" stroke="#e05252" stroke-width="2"/><text x="104" y="708" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#ff8080">Red boxes leave your control. They are usually the ones nobody remembers until the incident.</text>
