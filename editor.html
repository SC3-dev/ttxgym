<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Build and edit your own .ttxf tabletop exercise scenarios in the browser, with a live preview of exactly what facilitators and participants will see.">
  <link rel="canonical" href="https://ttxgym.com/editor.html">

  <meta name="theme-color" content="#141820">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TTX Gym">
  <meta property="og:title" content="Exercise Builder — TTX Gym">
  <meta property="og:description" content="Build and edit your own .ttxf tabletop exercise scenarios in the browser, with a live preview of exactly what facilitators and participants will see.">
  <meta property="og:url" content="https://ttxgym.com/editor.html">
  <meta property="og:image" content="https://ttxgym.com/hero.png">
  <meta property="og:image:alt" content="The TTX Gym exercise interface, showing a scenario stage and facilitator notes.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Exercise Builder — TTX Gym">
  <meta name="twitter:description" content="Build and edit your own .ttxf tabletop exercise scenarios in the browser, with a live preview of exactly what facilitators and participants will see.">
  <meta name="twitter:image" content="https://ttxgym.com/hero.png">
  <link rel="stylesheet" href="css/fonts.css">
  <!-- versioned: this page needs --sidebar-width and --text-label, both added to
       the site stylesheet after browsers had been caching it for months -->
  <link rel="stylesheet" href="style.css?v=2">
  <style>
    /* ═══ LAYOUT ═══════════════════════════════════════════════════════════
       Two zones replacing one long scroll: an outline that is both map and
       navigation, and a workspace showing one stage at a time. The participant
       view floats over them rather than taking a column of its own — it is 16:9,
       and a column is the wrong shape for it. See docs/BUILDER-DESIGN.md. */
    #b-wrap {
      display: grid;
      /* The fallback is not decoration. --sidebar-width lives in style.css, and if
         that file is missing or cached from before the token existed, var() with
         no fallback makes the whole declaration invalid — the grid collapses to
         one column and the rail spans the page. A layout must not depend on
         another file having arrived. */
      grid-template-columns: var(--sidebar-width, 280px) minmax(0, 1fr);
      /* body is already a flex column with the nav in it, so the workspace takes
         what is left rather than guessing at a nav height — which is what the old
         builder did, subtracting 56px from a nav that is 80px tall. */
      flex: 1;
      min-height: 0;
      overflow: hidden;
      transition: grid-template-columns 0.2s ease;
    }


    /* ═══ OUTLINE ═══ */
    /* The gym's controller is var(--surface) at var(--sidebar-width); this is the
       same rail on a different page, so it is the same colour and the same width. */
    #b-outline {
      border-right: 1px solid var(--border);
      background: var(--surface);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    h1.b-name, h2.b-rail-head, .b-zone-head { margin: 0; }
    /* the gym's section headings, to the letter */
    .b-rail-head {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-label);
      padding: 0.85rem 0.9rem 0.35rem;
    }
    .b-meta { padding: 0 0.7rem 0.6rem; }
    .b-meta input, .b-meta textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-family: var(--font-display);
      font-size: 12.5px;
      padding: 0.4rem 0.55rem;
      margin-bottom: 0.3rem;
      outline: none;
    }
    .b-meta textarea { resize: vertical; min-height: 3.2em; line-height: 1.5; }
    .b-meta input:focus, .b-meta textarea:focus { border-color: var(--accent); }

    #b-stage-list { padding: 0 0.5rem; flex: 1; }
    .b-stage-row {
      display: grid;
      grid-template-columns: 1.4rem minmax(0, 1fr);
      gap: 0.45rem;
      align-items: baseline;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius);
      padding: 0.4rem 0.45rem;
      margin-bottom: 0.15rem;
      cursor: pointer;
      color: var(--text-secondary);
      font: inherit;
      font-size: 12.5px;
    }
    .b-stage-row:hover { color: var(--text-primary); background: var(--surface); }
    .b-stage-row.current {
      color: var(--text-primary);
      background: var(--surface);
      border-color: var(--accent);
    }
    .b-stage-row .n {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-label);
    }
    .b-stage-row.current .n { color: var(--accent); }
    .b-stage-row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .b-stage-row .sub {
      grid-column: 2;
      font-family: var(--font-mono);
      font-size: 9.5px;
      color: var(--text-label);
      margin-top: 0.1rem;
    }
    .b-untitled { opacity: 0.55; font-style: italic; }

    /* a stage's share of the running time, so pacing is visible while authoring */
    .b-bar { grid-column: 2; height: 2px; background: var(--border); border-radius: 2px; margin-top: 0.3rem; }
    .b-bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }

    #b-rail-foot {
      border-top: 1px solid var(--border);
      padding: 0.6rem 0.9rem;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-label);
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
    }
    #b-rail-foot .over { color: var(--amber); }

    /* ═══ WORKSPACE ═══ */
    #b-work { overflow-y: auto; min-height: 0; }
    /* Wide enough for a scenario stage to look like a page rather than a column
       of form fields, and still short enough a line stays readable. */
    #b-work-inner { max-width: 1040px; margin: 0 auto; padding: 1.1rem 1.6rem 4rem; }
    /* so a short stage does not sit in a sliver at the top of an empty page */
    #b-work-inner > .b-zone.screen { min-height: 22rem; }
    .b-rich[data-field="content"] .b-editable { min-height: 14rem; }
    .b-rich[data-field="summary"] .b-editable,
    .b-rich[data-field="conclusion"] .b-editable { min-height: 16rem; }

    .b-stage-title {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid transparent;
      color: var(--text-primary);
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 600;
      padding: 0.1rem 0 0.35rem;
      outline: none;
    }
    .b-stage-title:hover { border-bottom-color: var(--border); }
    .b-stage-title:focus { border-bottom-color: var(--accent); }

    .b-stage-meta {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 0.45rem 0 1.3rem;
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-label);
    }
    .b-stage-meta input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 10.5px;
      padding: 0.25rem 0.45rem;
      width: 6.5rem;
      outline: none;
    }
    .b-stage-meta input:focus { border-color: var(--accent); }

    /* the two audiences, as two surfaces */
    .b-zone { margin-bottom: 1.6rem; }
    .b-zone-head {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      margin-bottom: 0.55rem;
    }
    .b-zone-head::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .b-zone.screen .b-zone-head { color: var(--accent); }
    .b-zone.notes .b-zone-head { color: var(--amber); }
    .b-zone-body {
      border-left: 2px solid var(--border);
      padding-left: 0.9rem;
    }
    .b-zone.screen .b-zone-body { border-left-color: color-mix(in srgb, var(--accent) 40%, transparent); }
    .b-zone.notes .b-zone-body { border-left-color: color-mix(in srgb, var(--amber) 40%, transparent); }

    .b-field { margin-bottom: 0.9rem; }
    .b-field-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-label);
      margin-bottom: 0.3rem;
      display: block;
    }
    .b-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-family: var(--font-display);
      font-size: 13.5px;
      line-height: 1.6;
      padding: 0.6rem 0.8rem;
      outline: none;
      resize: vertical;
    }
    .b-input:focus { border-color: var(--accent); }

    .b-list-item { display: flex; gap: 0.4rem; margin-bottom: 0.3rem; align-items: flex-start; }
    .b-list-item .b-input { flex: 1; }
    .b-icon-btn {
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius);
      color: var(--text-label);
      cursor: pointer;
      padding: 0.3rem 0.45rem;
      font: inherit;
      font-size: 13px;
      line-height: 1.4;
    }
    .b-icon-btn:hover { color: var(--red); border-color: var(--border); }
    .b-add {
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--text-label);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 10.5px;
      padding: 0.3rem 0.6rem;
      margin-top: 0.15rem;
    }
    .b-add:hover { color: var(--accent); border-color: var(--accent); }

    /* ═══ WYSIWYG CONTENT ═══
       The author edits the rendered thing. A source toggle sits behind it for
       when that is not what they want. */
    .b-rich { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
    .b-rich:focus-within { border-color: var(--accent); }
    /* The bar mixes two kinds of control: marks, which are single glyphs, and
       blocks, which need a word. Giving them one font size made the glyphs
       illegible and the words cramped, so they get one shared height and two
       shapes — square for a mark, labelled for a block. */
    .b-rich-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.12rem;
      padding: 0.25rem 0.3rem;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--mid) 60%, transparent);
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .b-rich-bar button {
      height: 1.55rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius);
      color: var(--text-secondary);
      cursor: pointer;
      font-family: var(--font-display);
      line-height: 1;
      padding: 0 0.45rem;
    }
    .b-rich-bar button.ico {
      min-width: 1.55rem;
      padding: 0;
      font-size: 13px;
    }
    .b-rich-bar button.ico[data-cmd="bold"] { font-weight: 800; }
    .b-rich-bar button.ico[data-cmd="italic"] { font-style: italic; font-family: Georgia, serif; }
    .b-rich-bar button.ico[data-cmd="code"] { font-family: var(--font-mono); font-size: 10px; }
    .b-rich-bar button.lbl {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .b-rich-bar button:hover {
      color: var(--text-primary);
      background: var(--surface);
      border-color: var(--border);
    }
    .b-rich-bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .b-rich-bar .sep {
      flex: 0 0 1px;
      align-self: stretch;
      background: var(--border);
      margin: 0.15rem 0.3rem;
    }
    .b-rich-bar .grow { flex: 1; }
    .b-rich-bar button.on,
    .b-rich-bar button[aria-pressed="true"] {
      color: var(--accent);
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
    }

    .b-editable {
      /* A stage's content is the main writing surface, so it gets a page-like
         floor rather than collapsing to the height of one line. The narrower
         fields keep theirs, which is set alongside. */
      min-height: 7em;
      padding: 0.7rem 0.85rem;
      color: var(--text-primary);
      font-family: var(--font-display);
      font-size: 13.5px;
      line-height: 1.7;
      outline: none;
      overflow-wrap: break-word;
    }
    .b-editable:empty::before {
      content: attr(data-placeholder);
      color: var(--text-label);
    }
    .b-editable p { margin: 0 0 0.6rem; }
    .b-editable p:last-child { margin-bottom: 0; }
    .b-editable strong { color: var(--text-primary); }
    .b-editable ul, .b-editable ol { margin: 0 0 0.6rem; padding-left: 1.3rem; }
    .b-editable li { margin-bottom: 0.2rem; }
    .b-editable blockquote {
      margin: 0.6rem 0;
      padding: 0.5rem 0.8rem;
      background: var(--green-glow);
      border-left: 3px solid var(--green);
      border-radius: 0 var(--radius) var(--radius) 0;
    }
    .b-editable code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      padding: 0.1em 0.35em;
      border-radius: 4px;
      background: color-mix(in srgb, currentColor 10%, transparent);
      border: 1px solid color-mix(in srgb, currentColor 18%, transparent);
    }
    /* a picture is the only block left with nothing to type into */
    .b-editable img.SFmedia { user-select: all; }
    .b-editable pre.SFpre {
      font-family: var(--font-mono);
      font-size: 0.82em;
      line-height: 1.55;
      margin: 0.7rem 0;
      padding: 0.6rem 0.75rem;
      border-radius: var(--radius);
      background: color-mix(in srgb, currentColor 7%, transparent);
      border: 1px solid color-mix(in srgb, currentColor 15%, transparent);
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }
    .b-editable pre.SFpre > code { background: none; border: 0; padding: 0; font-size: inherit; }
    /* Everywhere else the label is drawn with ::before from data-label, which
       cannot be typed into. Here it is a real element, so it is suppressed. */
    .b-editable pre.SFpre[data-label]::before { content: none; }
    .b-editable .SFpre-label {
      display: block;
      font-family: var(--font-display);
      font-size: 0.78em;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.75;
      margin-bottom: 0.4rem;
      user-select: text;
      cursor: text;
      outline: 1px dashed transparent;
      outline-offset: 2px;
      border-radius: 3px;
    }
    .b-editable pre.SFpre:hover .SFpre-label { outline-color: color-mix(in srgb, currentColor 35%, transparent); }
    .b-editable .SFpre-label:focus { outline: 2px solid var(--accent); opacity: 1; }
    .b-editable .SFpre-label:empty::before {
      content: 'Label this artefact';
      opacity: 0.6;
      font-style: italic;
      text-transform: none;
      letter-spacing: 0;
    }
    .b-editable pre.SFpre > code { user-select: text; cursor: text; }
    /* The editor shows the size the author chose. width is set from data-scale
       against the picture's natural width, exactly as the gym does it; max-width
       only stops a large picture from bursting the column, and never changes what
       is stored. */
    .b-editable img.SFmedia {
      display: block;
      margin: 0.7rem auto;
      max-width: 100%;
      height: auto;
      border-radius: var(--radius);
      cursor: pointer;
    }


    /* The furniture for a selected block floats over it rather than wrapping it:
       a wrapper element would nest the block, and htmlToSource reads top-level
       children, so the block would vanish from the file. */
    #b-tools { position: fixed; z-index: 650; pointer-events: none; }
    #b-tools.hide { display: none; }
    #b-tools .grip {
      position: absolute;
      right: -7px;
      bottom: -7px;
      width: 14px;
      height: 14px;
      border-radius: 3px;
      background: var(--accent);
      border: 2px solid var(--mid);
      cursor: nwse-resize;
      pointer-events: auto;
    }
    #b-tools .read {
      position: absolute;
      left: 0;
      top: -0.5rem;
      transform: translateY(-100%);
      background: var(--accent);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 0.2rem 0.45rem;
      border-radius: var(--radius);
      white-space: nowrap;
      pointer-events: auto;
      cursor: pointer;
      border: 0;
    }
    #b-tools .kill {
      position: absolute;
      right: -0.55rem;
      top: -0.55rem;
      width: 1.35rem;
      height: 1.35rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--red);
      color: #fff;
      border: 2px solid var(--mid);
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      pointer-events: auto;
      padding: 0;
    }
    #b-tools .kill:hover { filter: brightness(1.15); }
    #b-tools.no-size .grip, #b-tools.no-size .read { display: none; }
    #b-tools .grip:focus-visible, #b-tools .kill:focus-visible, #b-tools .read:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 1px;
    }
    /* whatever is selected, not just a picture */
    .b-editable .b-picked { outline: 2px solid var(--accent); outline-offset: 3px; }
    .b-editable pre.SFpre, .b-editable figure.SFnews { cursor: default; }
    .b-editable figure.SFnews {
      position: relative; display: block; margin: 0.7rem auto; max-width: min(100%, 26em);
      border-radius: var(--radius); overflow: hidden; container-type: inline-size; font-size: 11px;
    }
    @supports (container-type:inline-size) { .b-editable figure.SFnews { font-size: clamp(6px, 2.5cqi, 16px) } }
    .b-editable figure.SFnews img { display: block; width: 100%; height: auto; }
    .b-editable .SFnews-ticker { position: absolute; left: 0; right: 0; bottom: 0; display: flex; }
    .b-editable .SFnews-flag { background: #c8102e; color: #fff; font-weight: 800; font-size: .78em; text-transform: uppercase; padding: .7em .8em; }
    .b-editable .SFnews-line { flex: 1; background: rgba(11,14,20,.9); color: #fff; font-weight: 700; font-size: .78em; padding: .7em .8em; }
    /* the headline and its flag are the one part of the frame worth typing into */
    .b-editable .SFnews-line[contenteditable], .b-editable .SFnews-flag[contenteditable] {
      user-select: text;
      cursor: text;
      outline: 1px dashed transparent;
      outline-offset: -2px;
    }
    .b-editable figure.SFnews:hover .SFnews-line[contenteditable],
    .b-editable figure.SFnews:hover .SFnews-flag[contenteditable] { outline-color: rgba(255, 255, 255, 0.45); }
    .b-editable .SFnews-line[contenteditable]:focus, .b-editable .SFnews-flag[contenteditable]:focus {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }
    .b-editable .SFnews-line[contenteditable]:empty::before {
      content: 'Headline';
      opacity: 0.55;
    }

    .b-source {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.65;
      padding: 0.7rem 0.85rem;
      outline: none;
      resize: vertical;
      /* The same floor as the field it replaces. It used to be 9em of a 12px
         monospace — barely half the height of the editor — so opening Source
         shrank the box to a slot. */
      min-height: 14rem;
      overflow-y: hidden;                 /* it grows to its content instead */
    }
    .b-rich[data-field="summary"] .b-source,
    .b-rich[data-field="conclusion"] .b-source { min-height: 16rem; }

    /* ═══ QUESTIONS ═══ */
    .b-q {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 0.6rem 0.7rem;
      margin-bottom: 0.55rem;
    }
    .b-q-top { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.5rem; }
    .b-q-text {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px solid transparent;
      color: var(--text-primary);
      font-family: var(--font-display);
      font-size: 13.5px;
      font-weight: 600;
      padding: 0.15rem 0;
      outline: none;
    }
    .b-q-text:hover { border-bottom-color: var(--border); }
    .b-q-text:focus { border-bottom-color: var(--accent); }

    .b-ans { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.25rem; }
    .b-ans input[type=text] {
      flex: 1;
      background: var(--back);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-family: var(--font-display);
      font-size: 12.5px;
      padding: 0.3rem 0.5rem;
      outline: none;
    }
    .b-ans input[type=text]:focus { border-color: var(--accent); }
    .b-ans.correct input[type=text] { border-color: var(--green); }
    /* marking an answer correct is what turns a poll into a scored question */
    .b-mark {
      width: 1.35rem; height: 1.35rem;
      flex: 0 0 auto;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-label);
      cursor: pointer;
      font-size: 11px;
      line-height: 1;
      padding: 0;
    }
    .b-mark:hover { border-color: var(--green); color: var(--green); }
    .b-ans.correct .b-mark { background: var(--green); border-color: var(--green); color: #06251f; }

    .b-q-foot {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      margin-top: 0.4rem;
      flex-wrap: wrap;
    }
    .b-q-foot select {
      background: var(--back);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-label);
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 0.25rem 0.35rem;
      outline: none;
    }
    .b-q-kind {
      font-family: var(--font-mono);
      font-size: 9.5px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-label);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 0.1rem 0.45rem;
    }
    .b-q-kind.scored { color: var(--green); border-color: color-mix(in srgb, var(--green) 45%, transparent); }

    /* pacing: a stage whose clock looks out of step with what is in it */
    .b-stage-row .warn { color: var(--amber); }

    /* the opening and the debrief: in the order, but plainly not stages */
    .b-stage-row.b-bookend .n { color: var(--accent); opacity: 0.8; font-size: 9px; }
    .b-stage-row.b-bookend .t { font-style: italic; }
    .b-stage-row.b-bookend { margin-bottom: 0.3rem; }
    .b-stage-row.b-bookend + .b-stage-row { margin-top: 0.1rem; }

    /* visible only to a screen reader */
    .b-sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
    #b-pace {
      font-family: var(--font-mono); font-size: 10px; color: var(--amber);
      padding: 0 0.9rem 0.6rem;
    }

    .b-empty {
      color: var(--text-label);
      font-size: 12.5px;
      padding: 2.5rem 0;
      text-align: center;
    }

    /* ═══ THE MIRROR ═══════════════════════════════════════════════════════
       The participant document itself, at 1280x720, scaled down and floated over
       the workspace — the same picture-in-picture the gym gives a facilitator.
       One width drives the panel, the 16:9 frame and the scale of the document
       inside it; CSS cannot divide by a length, so the scale is set alongside. */
    #b-mirror {
      position: fixed;
      right: 1.25rem;
      bottom: 1.25rem;
      z-index: 600;
      --mirror-w: 400px;
      --mirror-scale: 0.3125;
      --mirror-ratio: 0.5625;
      --mirror-vw: 1280px;
      --mirror-vh: 720px;
      width: var(--mirror-w);
      background: var(--mid);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    #b-mirror.hide { display: none; }

    #b-mirror-head {
      cursor: move;
      touch-action: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.35rem 0.4rem 0.7rem;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
    }
    #b-mirror-head .grow { flex: 1; }
    #b-mirror-head button {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      padding: 0.15rem 0.4rem;
      border-radius: var(--radius);
    }
    #b-mirror-head button:hover { color: var(--text-primary); background: var(--surface); }

    #b-mirror-wrap {
      width: var(--mirror-w);
      height: calc(var(--mirror-w) * var(--mirror-ratio));
      overflow: hidden;
      background: var(--back);
    }
    #b-mirror.collapsed #b-mirror-wrap { display: none; }

    /* live, not a picture: it is the real document, scaled */
    #b-mirror iframe {
      width: var(--mirror-vw);
      height: var(--mirror-vh);
      border: 0;
      transform: scale(var(--mirror-scale));
      transform-origin: top left;
    }

    /* drag the corner to resize */
    #b-mirror-grip {
      position: absolute;
      left: 0;
      top: 0;
      width: 14px;
      height: 14px;
      cursor: nwse-resize;
      touch-action: none;
      z-index: 2;
    }
    #b-mirror-grip::before {
      content: '';
      position: absolute;
      inset: 4px;
      border-top: 2px solid var(--text-secondary);
      border-left: 2px solid var(--text-secondary);
      border-radius: 2px 0 0 0;
    }
    #b-mirror-grip:hover::before, #b-mirror-grip:focus-visible::before { border-color: var(--accent); }

    /* ═══ PROBLEMS, GALLERY, DROP ══════════════════════════════════════════
       Three things the author needs occasionally and should not have to hunt
       for: what is wrong, a picture, and a way to open a file. */
    #b-problems {
      position: absolute;
      top: calc(100% + 0.3rem);
      left: 0.9rem;
      z-index: 700;
      width: min(30rem, calc(100vw - 2rem));
      max-height: 55vh;
      overflow-y: auto;
      background: var(--mid);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 0.35rem;
    }
    #b-problems.hide { display: none; }
    .b-problem {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      border-left: 2px solid var(--amber);
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 1.45;
      padding: 0.4rem 0.6rem;
      margin-bottom: 0.15rem;
      border-radius: 0 var(--radius) var(--radius) 0;
    }
    .b-problem.err { border-left-color: var(--red); }
    .b-problem:hover { background: var(--surface); color: var(--text-primary); }
    .b-problem .where { display: block; font-size: 10.5px; font-family: var(--font-mono); color: var(--text-label); }
    .b-stage-row .flag { color: var(--red); margin-left: 0.25rem; }

    /* the gallery */
    .b-modal {
      position: fixed;
      inset: 0;
      z-index: 800;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .b-modal.hide { display: none; }
    .b-modal-box {
      background: var(--mid);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      width: min(52rem, 100%);
      max-height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .b-modal-head {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 0.9rem;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
    }
    .b-modal-body { padding: 0.8rem 0.9rem; overflow-y: auto; }
    .b-modal-foot {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 0.9rem;
      border-top: 1px solid var(--border);
    }
    #b-gal-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.15rem;
      border-bottom: 1px solid var(--border);
      padding: 0 0.9rem;
    }
    #b-gal-tabs button {
      background: none;
      border: 0;
      border-bottom: 2px solid transparent;
      color: var(--text-secondary);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      padding: 0.5rem 0.6rem;
    }
    #b-gal-tabs button:hover { color: var(--text-primary); }
    #b-gal-tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
    #b-gal-tabs .count { color: var(--text-label); font-size: 10px; margin-left: 0.3rem; }
    #b-gal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr));
      gap: 0.5rem;
    }
    .b-gal-item {
      background: var(--back);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-secondary);
      font-size: 10.5px;
      text-align: center;
    }
    .b-gal-item:hover, .b-gal-item:focus-visible { border-color: var(--accent); color: var(--text-primary); }
    .b-gal-item img { width: 100%; height: 5rem; object-fit: contain; }
    .b-gal-item .name { display: block; }
    /* shown where the choice is made, not buried in a file nobody opens */
    .b-gal-item .credit {
      display: block;
      font-family: var(--font-mono);
      font-size: 9px;
      line-height: 1.35;
      color: var(--text-label);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }
    .b-gal-item .credit b { font-weight: 600; color: var(--amber); }
    .b-gal-note {
      font-size: 11px;
      color: var(--text-label);
      padding: 0.6rem 0 0;
      border-top: 1px solid var(--border);
      margin-top: 0.8rem;
    }
    .b-gal-note a { color: var(--accent); }
    .b-gal-empty { color: var(--text-label); font-size: 12px; padding: 1.5rem 0; text-align: center; }

    /* dropping a file anywhere on the page */
    #b-drop {
      position: fixed;
      inset: 0;
      z-index: 900;
      background: rgba(0, 0, 0, 0.6);
      border: 3px dashed var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: var(--text-primary);
      pointer-events: none;
    }
    #b-drop.hide { display: none; }

    /* a word about where the scenario in front of you came from */
    #b-notice {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.5rem 0.9rem;
      background: color-mix(in srgb, var(--accent) 10%, var(--mid));
      border-bottom: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border));
      font-family: var(--font-display);
      font-size: 12px;
      color: var(--text-primary);
    }
    #b-notice.hide { display: none; }
    #b-notice::before {
      content: '';
      flex: 0 0 3px;
      align-self: stretch;
      border-radius: 2px;
      background: var(--accent);
    }
    #b-notice-text { flex: 1; min-width: 12rem; color: var(--text-secondary); }
    #b-notice .btn { height: 1.7rem; font-size: 11.5px; }
    #b-notice .btn-dismiss {
      background: none;
      border: 0;
      padding: 0 0.35rem;
      color: var(--text-label);
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      border-radius: var(--radius);
    }
    #b-notice .btn-dismiss:hover { color: var(--text-primary); background: var(--surface); }

    /* ═══ BUTTONS ══════════════════════════════════════════════════════════
       The .btn family lived inside the builder this page replaced and went with
       it, leaving nine buttons here rendering as raw browser defaults. Redefined
       at this page's own scale, which is denser than the site's. */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      height: 1.85rem;
      padding: 0 0.75rem;
      border: 1px solid transparent;
      border-radius: var(--radius);
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .btn svg { width: 14px; height: 14px; fill: currentColor; }
    .btn-ghost {
      background: var(--surface);
      color: var(--text-secondary);
      border-color: var(--border);
    }
    .btn-ghost:hover { background: var(--mid); color: var(--text-primary); border-color: var(--border-active); }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-quiet {
      background: transparent;
      color: var(--text-secondary);
      border-color: transparent;
      padding: 0 0.5rem;
    }
    .btn-quiet:hover { background: var(--surface); color: var(--text-primary); }

    /* ═══ TOP BAR ═══ */
    #b-top {
      position: relative;                 /* the problems list hangs off it */
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.9rem;
      border-bottom: 1px solid var(--border);
      background: var(--mid);
    }
    #b-top .grow { flex: 1; }
    #b-top .b-name {
      font-family: var(--font-display);
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--text-primary);
      margin-right: 0.15rem;
    }
    #b-top .rule {
      flex: 0 0 1px;
      align-self: stretch;
      background: var(--border);
      margin: 0.2rem 0.35rem;
    }
    #b-status {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: none;
      border: 1px solid transparent;
      height: 1.85rem;
      padding: 0 0.45rem;
      border-radius: var(--radius);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 10.5px;
      line-height: 1;
      color: var(--text-label);
    }
    #b-status::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.85;
    }
    #b-status:hover { background: var(--surface); border-color: var(--border); color: var(--text-primary); }
    #b-status.bad { color: var(--red); }
    #b-status.good { color: var(--green); }

    @media (max-width: 900px) {
      #b-wrap { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      #b-outline { max-height: 34vh; }
    }
  </style>
</head>
