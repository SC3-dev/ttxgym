  <!-- versioned: this page depends on TTXF.htmlToSource, and a cached copy
       of the module without it would silently swallow the author's typing -->
  <script src="js/ttxf.js?v=2"></script>
  <script src="js/participant-view.js?v=2"></script>
  <script>
    /* ═══ MODEL ═══════════════════════════════════════════════════════════
       One document, one focused stage. Everything goes through TTXF.parse and
       TTXF.serialize so the file is the single source of truth and the
       round-trip guarantee the tests protect keeps holding. */
    const DRAFT_KEY = 'ttxgym_builder_draft';     // distinct from the old builder's
    let doc = { title: '', author: '', summary: '', conclusion: '', stages: [] };
    let focus = 0;
    let metaFocus = null;                    // 'summary' | 'conclusion' | null
    let saveTimer = null;

    const store = {
      get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
      del(k) { try { localStorage.removeItem(k); } catch (e) {} },
    };

    const esc = TTXF.escapeHTML;

    /* %news() puts a backdrop behind the headline, authored relative to gym/
       because that is where a scenario is played. This page is one level up, so
       it points the renderer at its own copy — the same one-level difference
       mediaDisplay() handles for scenario media. */
    TTXF.setNewsBackdrop('lib/exercise_data/news.jpeg');
    const blankStage = (name) => ({ stage: name || '', content: '', duration: '',
                                    discussion: [], prompts: [], questions: [] });

    function bMeta(key, value) { doc[key] = value; touched(); }

    function touched() {
      renderOutline();
      sendRoom();
      clearTimeout(saveTimer);
      saveTimer = setTimeout(save, 400);
      status();
    }

    function save() {
      const ok = store.set(DRAFT_KEY, JSON.stringify(doc));
      const el = document.getElementById('b-status');
      if (!ok) { el.textContent = 'could not save draft'; el.className = 'bad'; }
    }

    function toTTXF() { return TTXF.serialize(doc); }

    function load(text) {
      const { doc: parsed } = TTXF.parse(text);
      doc = {
        title: parsed.title || '', author: parsed.author || '',
        summary: parsed.summary || '', conclusion: parsed.conclusion || '',
        image: parsed.image || '',
        stages: (parsed.stages || []).map(s => ({
          stage: s.stage || '', content: s.content || '', duration: s.duration || '',
          discussion: (s.discussion || []).slice(),
          prompts: (s.prompts || []).slice(),
          questions: (s.questions || []).map(q => ({
            question: q.question, answers: (q.answers || []).slice(),
            quizIndex: q.quizIndex, participantHidden: !!q.participantHidden,
          })),
        })),
      };
      focus = 0;
      renderAll();
    }

    /* ═══ OUTLINE ═══ */
    function renderOutline() {
      ['title', 'author'].forEach(k => {
        const el = document.getElementById('b-' + k);
        if (el && el.value !== (doc[k] || '')) el.value = doc[k] || '';
      });
      const cover = document.getElementById('b-cover-label');
      if (cover) cover.textContent = doc.image
        ? 'Cover: ' + doc.image.split('/').pop()
        : 'Cover image…';

      const list = document.getElementById('b-stage-list');
      const badBy = {};
      problems().forEach(p => { if (p.severity === 'error' && p.stage > -1) badBy[p.stage] = true; });
      const paceBy = {};
      pacing().forEach(p => { paceBy[p.i] = p; });
      const secs = doc.stages.map(s => TTXF.durationToSeconds(s.duration));
      const longest = Math.max(1, ...secs);
      /* The opening and the debrief are screens the room reads, so they belong in
         the running order rather than hidden behind two buttons labelled with an
         ellipsis. They are not stages: no number, no clock, and not draggable. */
      const bookend = (field, name, note) => {
        const filled = (doc[field] || '').trim();
        const on = metaFocus === field;
        return `<button class="b-stage-row b-bookend${on ? ' current' : ''}" role="listitem"
                        aria-current="${on}" onclick="bFocusMeta('${field}')"
                        title="${esc(note)}">
          <span class="n" aria-hidden="true">${field === 'summary' ? '▸' : '■'}</span>
          <span class="t${filled ? '' : ' b-untitled'}">${esc(name)}</span>
          <span class="sub">${filled ? esc(TTXF.markdown(filled).replace(/<[^>]+>/g, ' ').trim().slice(0, 42))
                                     : 'Empty — click to write it'}</span>
        </button>`;
      };

      list.innerHTML = bookend('summary', 'Opening', 'What the room reads before the exercise begins')
        + doc.stages.map((s, i) => {
        const bits = [];
        if (s.duration) bits.push(s.duration);
        const qs = s.questions.filter(q => (q.question || '').trim()).length;
        if (qs) bits.push(qs + 'q');
        const d = s.discussion.filter(x => x.trim()).length;
        if (d) bits.push(d + 'd');
        const title = (s.stage || '').trim();
        const pace = paceBy[i];
        const on = !metaFocus && i === focus;
        return `<button class="b-stage-row${on ? ' current' : ''}" onclick="bFocus(${i})"
                        role="listitem" aria-current="${on}" draggable="true" data-i="${i}"
                        title="${pace ? esc('This stage looks ' + pace.how + ' for what is in it') : 'Drag to reorder'}">
          <span class="n" aria-hidden="true">${i + 1}</span>
          <span class="t${title ? '' : ' b-untitled'}">${esc(title || 'Untitled stage')}${
            badBy[i] ? '<span class="flag" title="Something in this stage needs attention">!</span>' : ''}</span>
          ${bits.length ? `<span class="sub">${esc(bits.join(' · '))}${
            pace ? `<span class="warn"> · ${pace.how} for its content</span>` : ''}</span>` : ''}
          ${secs[i] ? `<span class="b-bar"><i style="width:${Math.round(secs[i] / longest * 100)}%"></i></span>` : ''}
        </button>`;
      }).join('')
        + bookend('conclusion', 'Debrief', 'The finish screen — the last thing the room reads');

      if (!doc.stages.length) {
        list.insertAdjacentHTML('beforeend',
          '<div class="b-empty" style="padding:0.6rem 0;font-size:11.5px">No stages in between yet</div>');
      }

      const total = secs.reduce((a, b) => a + b, 0);
      document.getElementById('b-foot-count').textContent =
        doc.stages.length + ' stage' + (doc.stages.length === 1 ? '' : 's');
      document.getElementById('b-foot-time').textContent = total
        ? (total >= 3600
            ? Math.floor(total / 3600) + 'h ' + String(Math.round(total % 3600 / 60)).padStart(2, '0') + 'm'
            : Math.round(total / 60) + ' min') + ' planned'
        : 'untimed';
    }

    /* ═══ PACING ══════════════════════════════════════════════════════════
       The content review had to build this model to repair pacing across the
       whole library, because nothing in authoring ever surfaced that a stage
       with six discussion points had the same clock as one with one. Weighting
       here is the same: a discussion point is worth about two and a half
       minutes, a question about one, and prose about 45 seconds per hundred
       words, plus a little for arriving at the stage at all. */
    function stageWeight(s) {
      const words = (s.content || '').split(/\s+/).filter(Boolean).length;
      return 0.2 + 0.003 * words
           + 1.0 * s.discussion.filter(d => d.trim()).length
           + 0.4 * s.questions.filter(q => (q.question || '').trim()).length;
    }

    /* Only meaningful once enough of the exercise is timed to compare against,
       and only worth saying when a stage is well out of step — this is a nudge,
       not a rule. */
    function pacing() {
      const timed = doc.stages.filter(s => TTXF.durationToSeconds(s.duration) > 0);
      if (timed.length < 3) return [];
      const totalW = doc.stages.reduce((n, s) => n + stageWeight(s), 0);
      const totalT = timed.reduce((n, s) => n + TTXF.durationToSeconds(s.duration), 0);
      if (!totalW || !totalT) return [];
      return doc.stages.map((s, i) => {
        const secs = TTXF.durationToSeconds(s.duration);
        if (!secs) return null;
        const expected = stageWeight(s) / totalW * totalT;
        const ratio = secs / expected;
        if (ratio > 1.8) return { i, how: 'long', ratio };
        if (ratio < 0.55) return { i, how: 'short', ratio };
        return null;
      }).filter(Boolean);
    }

    function bFocus(i) { metaFocus = null; focus = i; renderWork(); renderOutline(); sendRoom(); document.getElementById('b-work').scrollTop = 0; }

    /* Summary and conclusion are prose like a stage is prose, so they are edited
       in the workspace with the same tools rather than crammed into the rail. */
    function bFocusMeta(field) { metaFocus = field; renderWork(); renderOutline(); sendRoom(); }

    function bAddStage() {
      doc.stages.push(blankStage());
      focus = doc.stages.length - 1;
      renderAll();
      const t = document.querySelector('.b-stage-title');
      if (t) t.focus();
    }

    function bMoveStage(i, dir) {
      const to = i + dir;
      if (to < 0 || to >= doc.stages.length) return;
      doc.stages.splice(to, 0, doc.stages.splice(i, 1)[0]);
      focus = to;
      renderAll();
    }

    /* A duplicate is a deep copy — a shared questions array would have two
       stages editing the same answers, which is the kind of fault nobody finds
       until the exercise is running. */
    function bDuplicateStage(i) {
      const s = doc.stages[i];
      doc.stages.splice(i + 1, 0, {
        stage: s.stage ? s.stage + ' (copy)' : '',
        content: s.content, duration: s.duration,
        discussion: s.discussion.slice(),
        prompts: s.prompts.slice(),
        questions: s.questions.map(q => ({
          question: q.question, answers: q.answers.slice(),
          quizIndex: q.quizIndex, participantHidden: q.participantHidden,
        })),
      });
      focus = i + 1;
      renderAll();
    }

    /* Dragging a row in the outline reorders the exercise. The page-wide file
       drop ignores this because it only reacts to a drag carrying Files. */
    function initOutlineDrag() {
      const list = document.getElementById('b-stage-list');
      let from = null;
      list.addEventListener('dragstart', ev => {
        const row = ev.target.closest('.b-stage-row');
        if (!row) return;
        from = Number(row.getAttribute('data-i'));
        if (ev.dataTransfer) { ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', String(from)); }
      });
      list.addEventListener('dragover', ev => { if (from !== null) ev.preventDefault(); });
      list.addEventListener('drop', ev => {
        if (from === null) return;
        ev.preventDefault();
        const row = ev.target.closest('.b-stage-row');
        const to = row ? Number(row.getAttribute('data-i')) : doc.stages.length - 1;
        if (to !== from && doc.stages[from]) {
          doc.stages.splice(to, 0, doc.stages.splice(from, 1)[0]);
          focus = to;
          renderAll();
        }
        from = null;
      });
      list.addEventListener('dragend', () => { from = null; });
    }

    /* ═══ WORKSPACE ═══ */
    function renderWork() {
      const el = document.getElementById('b-work-inner');
      pickMedia(null);                       // whatever was selected is about to be replaced
      sendRoom();                            // so no caller can forget to refresh the preview
      if (metaFocus) {
        const heading = metaFocus === 'summary' ? 'Summary' : 'Conclusion';
        const note = metaFocus === 'summary'
          ? 'Shown before the exercise begins — what the room is walking into.'
          : 'The finish screen. The last thing the room reads.';
        el.innerHTML = `<input class="b-stage-title" type="text" value="${esc(heading)}" disabled>
          <div class="b-stage-meta"><span>${esc(note)}</span></div>
          <section class="b-zone screen"><h2 class="b-zone-head">On screen</h2>
            <div class="b-zone-body">${richHTML(metaFocus, doc[metaFocus] || '', note)}</div>
          </section>`;
        el.querySelectorAll('.b-editable').forEach(dressEditable);
        return;
      }
      const s = doc.stages[focus];
      if (!s) {
        el.innerHTML = `<div class="b-empty">Nothing to edit yet.<br><br>
          <button class="b-add" onclick="bNewFromShape()">Start from a shape</button>
          <button class="b-add" onclick="bAddStage()">Add one blank stage</button></div>`;
        return;
      }
      el.innerHTML = `
        <input class="b-stage-title" type="text" value="${esc(s.stage)}"
               aria-label="Stage title" placeholder="Stage title" oninput="bStage('stage', this.value)">
        <div class="b-stage-meta">
          <span>Stage ${focus + 1} of ${doc.stages.length}</span>
          <span>·</span>
          <label>Planned <input type="text" value="${esc(s.duration)}" placeholder="10 mins"
                 oninput="bStage('duration', this.value)"></label>
          <span class="grow" style="flex:1"></span>
          <button class="b-icon-btn" title="Move this stage earlier"
                  ${focus === 0 ? 'disabled' : ''} onclick="bMoveStage(${focus}, -1)">↑</button>
          <button class="b-icon-btn" title="Move this stage later"
                  ${focus === doc.stages.length - 1 ? 'disabled' : ''} onclick="bMoveStage(${focus}, 1)">↓</button>
          <button class="b-icon-btn" title="Duplicate this stage" onclick="bDuplicateStage(${focus})">Duplicate</button>
          <button class="b-icon-btn" title="Delete this stage" onclick="bRemoveStage(${focus})">Delete</button>
        </div>

        <section class="b-zone screen">
          <h2 class="b-zone-head">On screen</h2>
          <div class="b-zone-body">
            <div class="b-field">
              <label class="b-field-label">Content</label>
              ${richHTML('content', s.content, 'What the room sees when this stage opens.')}
            </div>
            <div class="b-field">
              <label class="b-field-label">Discussion points</label>
              ${listHTML('discussion', s.discussion, 'A question for the room')}
              <button class="b-add" onclick="bAddItem('discussion')">+ Add discussion point</button>
            </div>
            <div class="b-field">
              <label class="b-field-label">Questions the room answers</label>
              ${questionsHTML(false)}
              <button class="b-add" onclick="bAddQuestion(false)">+ Add question</button>
            </div>
          </div>
        </section>

        <section class="b-zone notes">
          <h2 class="b-zone-head">Your notes — never shown to participants</h2>
          <div class="b-zone-body">
            <div class="b-field">
              <label class="b-field-label">Facilitator prompts</label>
              ${listHTML('prompts', s.prompts, 'What to probe, what a good answer sounds like')}
              <button class="b-add" onclick="bAddItem('prompts')">+ Add prompt</button>
            </div>
            <div class="b-field">
              <label class="b-field-label">Questions kept off the screen</label>
              ${questionsHTML(true)}
              <button class="b-add" onclick="bAddQuestion(true)">+ Add private question</button>
            </div>
          </div>
        </section>`;
      el.querySelectorAll('.b-editable').forEach(dressEditable);
    }

    /* ═══ RICH EDITING ═══════════════════════════════════════════════════
       The author works in the rendered output. On input the DOM is converted
       straight back to .ttxf through the shared module, so the file stays the
       source of truth and nothing is stored in a second representation.

       A stage the author never types into is never re-serialised, so opening a
       scenario cannot churn its formatting — only real edits change bytes. */
    const RICH_BUTTONS = [
      ['B', 'bold', 'Bold', 'ico'],
      ['I', 'italic', 'Italic', 'ico'],
      ['&lt;&gt;', 'code', 'Inline code', 'ico'],
      ['sep'],
      ['&#9679;&#8201;&#8212;', 'ul', 'Bulleted list', 'ico'],
      ['1.', 'ol', 'Numbered list', 'ico'],
      ['&#8220;', 'quote', 'Quote', 'ico'],
      ['sep'],
      ['Image', 'image', 'Insert an image', 'lbl'],
      ['News', 'news', 'Insert a news headline', 'lbl'],
      ['Artefact', 'pre', 'Insert a log or artefact block', 'lbl'],
    ];

    const FIELD_NAMES = { content: 'Stage content', summary: 'Opening', conclusion: 'Debrief' };

    function richHTML(field, value, placeholder) {
      const what = FIELD_NAMES[field] || field;
      const bar = RICH_BUTTONS.map(([glyph, cmd, title, shape]) =>
        cmd ? `<button type="button" class="${shape}" data-cmd="${cmd}" title="${esc(title)}"
                 aria-label="${esc(title)}" onmousedown="event.preventDefault()"
                 onclick="richCmd(this,'${cmd}')">${glyph}</button>`
            : '<span class="sep" role="separator"></span>').join('');
      return `<div class="b-rich" data-field="${field}">
        <div class="b-rich-bar" role="toolbar" aria-label="${esc(what)} formatting">${bar}<span class="grow"></span>
          <button type="button" class="lbl b-src-toggle" aria-pressed="false"
                  title="Edit the underlying .ttxf" onclick="richToggleSource(this)">Source</button>
        </div>
        <div class="b-editable" contenteditable="true" role="textbox" aria-multiline="true"
             aria-label="${esc(what)}" data-placeholder="${esc(placeholder)}"
             oninput="richInput(this)" onpaste="richPaste(event, this)" onkeydown="widgetKeys(event)">${TTXF.markdown(value)}</div>
        <textarea class="b-source" hidden rows="12" aria-label="${esc(what)} as .ttxf source"
                  oninput="richSourceInput(this)">${esc(value)}</textarea>
      </div>`;
    }

    function richOwner(el) { return el.closest('.b-rich'); }
    function richField(el) { return richOwner(el).getAttribute('data-field'); }

    function richInput(editable) {
      lockWidgets(editable);
      let source;
      try {
        source = TTXF.htmlToSource(editable);
      } catch (e) {
        // Losing an author's typing to a conversion fault is the worst thing this
        // page could do, so say so loudly and keep the text rather than write ''.
        failSafe('could not read the editor — switch to Source to keep working');
        return;
      }
      if (typeof source !== 'string') { failSafe('editor conversion unavailable'); return; }
      writeField(richField(editable), source);
    }

    function failSafe(message) {
      const el = document.getElementById('b-status');
      el.textContent = message;
      el.className = 'bad';
    }

    function richSourceInput(ta) { writeField(richField(ta), ta.value); autosizeSource(ta); }

    /* A scenario stage can be much longer than any sensible default height, and a
       long artefact inside a short scrolling box is worse than the WYSIWYG it was
       opened to escape. The floor comes from CSS; this only ever grows it. */
    function autosizeSource(ta) {
      if (!ta || !ta.style) return;
      ta.style.height = 'auto';
      const wanted = ta.scrollHeight;
      if (wanted) ta.style.height = wanted + 'px';
    }

    function writeField(field, source) {
      if (field === 'content') doc.stages[focus].content = source;
      else doc[field] = source;
      touched();
    }

    function readField(field) {
      return field === 'content' ? doc.stages[focus].content : (doc[field] || '');
    }

    function richToggleSource(btn) {
      const rich = richOwner(btn);
      const editable = rich.querySelector('.b-editable');
      const ta = rich.querySelector('.b-source');
      const toSource = ta.hasAttribute('hidden');
      if (toSource) {
        // read the live DOM, which is the thing the author can actually see;
        // fall back to the model only if that conversion is unavailable
        let live = null;
        try { live = TTXF.htmlToSource(editable); } catch (e) { live = null; }
        ta.value = typeof live === 'string' && live.trim() ? live : readField(richField(btn));
        ta.hidden = false; editable.hidden = true;
        btn.classList.add('on'); btn.setAttribute('aria-pressed', 'true');
        autosizeSource(ta);                 // only measurable once it is visible
        ta.focus();
      } else {
        const source = ta.value;
        // never replace visible content with nothing
        if (source.trim() || !editable.textContent.trim()) {
          writeField(richField(btn), source);
          editable.innerHTML = TTXF.markdown(source);
          dressEditable(editable);
        }
        ta.hidden = true; editable.hidden = false;
        btn.classList.remove('on'); btn.setAttribute('aria-pressed', 'false');
      }
    }

    /* Everything a freshly rendered editable needs before an author touches it. */
    function dressEditable(el) { mediaDisplay(el); lockWidgets(el); sizeAllMedia(el); }

    /* Blocks are objects, not text: made non-editable so a caret cannot land
       inside one and quietly break the markup it round-trips to.

       The news frame is the exception. Its headline is the only thing in it an
       author ever wants to change, and htmlToSource reads that headline straight
       out of the DOM — so the frame stays locked and the two bits of text inside
       it are opened up. */
    function lockWidgets(root) {
      root.querySelectorAll('pre.SFpre, figure.SFnews, img.SFmedia').forEach(el => {
        el.setAttribute('contenteditable', 'false');
      });
      openWidgetText(root);
    }

    /* Everywhere else an artefact's label is drawn from data-label with CSS,
       which nobody can type into. Here it is given a real element, which
       TTXF.htmlToSource reads in preference to the attribute — so editing it
       edits the file, and the block keeps its own body separate. */
    function openWidgetText(root) {
      root.querySelectorAll('pre.SFpre').forEach(pre => {
        if (!pre.querySelector('.SFpre-label')) {
          const label = document.createElement('span');
          label.className = 'SFpre-label';
          label.textContent = pre.getAttribute('data-label') || '';
          pre.insertBefore(label, pre.firstChild);
        }
      });
      root.querySelectorAll(
        'figure.SFnews .SFnews-line, figure.SFnews .SFnews-flag, pre.SFpre .SFpre-label, pre.SFpre > code'
      ).forEach(el => {
        el.setAttribute('contenteditable', 'true');
        el.setAttribute('spellcheck', 'false');
      });
    }

    /* A headline and a label are each one line. Enter would leave a <br> or a
       stray div inside an element the converter reads as plain text, so it moves
       the caret out instead. Inside an artefact's body a newline is the point,
       so Enter is left alone there. */
    function widgetKeys(ev) {
      if (ev.key !== 'Enter' || !ev.target.closest) return;
      const oneLine = ev.target.closest('.SFnews-line, .SFnews-flag, .SFpre-label');
      if (!oneLine) return;
      ev.preventDefault();
      oneLine.blur();
    }

    /* ═══ SELECTED BLOCKS ═════════════════════════════════════════════════
       A block — a picture, an artefact, a news frame — is not text, so the usual
       ways of getting rid of something do not obviously apply to it. Clicking one
       selects it and brings up its controls: a remove button on every block, and
       for a picture a size grip and a percentage.

       %(url | 60%) is a percentage of the picture's own width, which the gym
       applies at render time. The editor ignored it completely: an author set a
       quarter-size image and saw it full width, which is not a preview of
       anything. It is applied here the same way.

       The controls float over the block rather than wrapping it, because a
       wrapper would nest it and TTXF.htmlToSource reads top-level children — the
       block would disappear from the file on the next keystroke. */
    const SIZE_MIN = 5, SIZE_MAX = 100;
    const BLOCKS = '.b-editable img.SFmedia, .b-editable pre.SFpre, .b-editable figure.SFnews';
    let picked = null;

    function isPicture(el) { return !!el && el.tagName === 'IMG'; }

    function scaleOf(img) {
      const raw = (img.getAttribute('data-scale') || '').trim();
      const n = /^(\d+(?:\.\d+)?)\s*%?$/.exec(raw);
      return n ? Math.min(SIZE_MAX, Math.max(SIZE_MIN, parseFloat(n[1]))) : 100;
    }

    function sizeMedia(img) {
      const apply = () => {
        if (!img.naturalWidth) return;
        img.style.width = Math.round(img.naturalWidth * (scaleOf(img) / 100)) + 'px';
      };
      if (img.complete) apply();
      else img.addEventListener('load', apply, { once: true });
    }

    function sizeAllMedia(root) { root.querySelectorAll('img.SFmedia').forEach(sizeMedia); }

    function pickBlock(el) {
      if (picked) picked.classList.remove('b-picked');
      picked = el || null;
      const tools = document.getElementById('b-tools');
      if (!picked) { tools.classList.add('hide'); return; }
      picked.classList.add('b-picked');
      tools.classList.toggle('no-size', !isPicture(picked));
      tools.classList.remove('hide');
      placeTools();
    }

    // the old name, kept because a picture is still the usual thing to select
    function pickMedia(img) { pickBlock(img); }

    function placeTools() {
      if (!picked) return;
      const tools = document.getElementById('b-tools');
      const r = picked.getBoundingClientRect();
      // it can be scrolled out from under its own controls
      if (r.bottom < 0 || r.top > window.innerHeight) { tools.classList.add('hide'); return; }
      tools.classList.remove('hide');
      tools.style.left = r.left + 'px';
      tools.style.top = r.top + 'px';
      tools.style.width = r.width + 'px';
      tools.style.height = r.height + 'px';
      if (isPicture(picked)) {
        const pct = Math.round(scaleOf(picked));
        tools.querySelector('.read').textContent = pct + '%';
        tools.querySelector('.grip').setAttribute('aria-valuenow', String(pct));
      }
      tools.querySelector('.kill').setAttribute('aria-label', 'Remove this ' + blockName(picked));
    }

    function blockName(el) {
      if (isPicture(el)) return 'picture';
      if (el.tagName === 'PRE') return 'artefact';
      if (el.tagName === 'FIGURE') return 'news frame';
      return 'block';
    }

    function removeBlock() {
      if (!picked) return;
      const editable = picked.closest('.b-editable');
      picked.remove();
      pickBlock(null);
      if (editable) { dressEditable(editable); richInput(editable); }
    }

    function setMediaScale(img, pct, commit) {
      const v = Math.min(SIZE_MAX, Math.max(SIZE_MIN, Math.round(pct)));
      img.setAttribute('data-scale', v + '%');
      sizeMedia(img);
      placeTools();
      if (commit) {
        const editable = img.closest('.b-editable');
        if (editable) richInput(editable);
      }
    }

    function initBlockTools() {
      const tools = document.getElementById('b-tools');
      const grip = tools.querySelector('.grip');
      const read = tools.querySelector('.read');

      const begin = ev => {
        if (!isPicture(picked) || !picked.naturalWidth) return;
        ev.preventDefault();
        const startX = ev.clientX;
        const startW = picked.getBoundingClientRect().width;
        const natural = picked.naturalWidth;
        const move = e => setMediaScale(picked, (startW + (e.clientX - startX)) / natural * 100, false);
        const stop = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', stop);
          window.removeEventListener('mousemove', move);
          window.removeEventListener('mouseup', stop);
          if (isPicture(picked)) setMediaScale(picked, scaleOf(picked), true);
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', stop);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', stop);
      };
      grip.addEventListener('pointerdown', begin);
      grip.addEventListener('mousedown', begin);
      read.addEventListener('click', () => { if (isPicture(picked)) setMediaScale(picked, 100, true); });
      grip.addEventListener('keydown', ev => {
        if (!isPicture(picked)) return;
        const step = ev.shiftKey ? 10 : 2;
        if (ev.key === 'ArrowRight' || ev.key === 'ArrowUp') { setMediaScale(picked, scaleOf(picked) + step, true); ev.preventDefault(); }
        else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown') { setMediaScale(picked, scaleOf(picked) - step, true); ev.preventDefault(); }
      });

      /* A block is selected by clicking it, and let go of by clicking away — but
         a click on the text inside an artefact or a headline is someone placing a
         caret, so that selects the block without stealing the caret. */
      document.addEventListener('click', ev => {
        const block = ev.target.closest && ev.target.closest(BLOCKS);
        if (block) { pickBlock(block); return; }
        if (!ev.target.closest || !ev.target.closest('#b-tools')) pickBlock(null);
      });

      // keyboard, but never while the caret is in text, where these keys mean
      // move the caret and delete a character
      document.addEventListener('keydown', ev => {
        if (!picked) return;
        const a = document.activeElement;
        const typing = a && (a.isContentEditable ||
                             (a.closest && a.closest('[contenteditable="true"]')) ||
                             /^(input|textarea|select)$/i.test(a.tagName));
        if (typing) {
          if (ev.key === 'Escape') pickBlock(null);
          return;
        }
        if (ev.key === 'Escape') { pickBlock(null); return; }
        if (ev.key === 'Delete' || ev.key === 'Backspace') { removeBlock(); ev.preventDefault(); return; }
        if (!isPicture(picked)) return;
        const step = ev.shiftKey ? 10 : 2;
        if (ev.key === 'ArrowRight' || ev.key === 'ArrowUp') { setMediaScale(picked, scaleOf(picked) + step, true); ev.preventDefault(); }
        else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown') { setMediaScale(picked, scaleOf(picked) - step, true); ev.preventDefault(); }
      });

      window.addEventListener('scroll', placeTools, true);
      window.addEventListener('resize', placeTools);
    }

    /* Anything pasted is pushed through the format and back, so what lands is
       always something .ttxf can express — no smuggled markup, no surprises. */
    function richPaste(ev, editable) {
      ev.preventDefault();
      const cb = ev.clipboardData;
      if (!cb) return;
      const html = cb.getData('text/html');
      const text = cb.getData('text/plain');
      let source;
      if (html) {
        const holder = document.createElement('div');
        holder.innerHTML = TTXF.sanitizeHTML(html);
        source = TTXF.htmlToSource(holder);
      } else {
        source = text;
      }
      document.execCommand('insertHTML', false, TTXF.markdown(source));
      dressEditable(editable);
      richInput(editable);
    }

    function richCmd(btn, cmd) {
      const rich = richOwner(btn);
      const editable = rich.querySelector('.b-editable');
      if (editable.hidden) return;                      // in source mode
      editable.focus();
      const simple = { bold: 'bold', italic: 'italic',
                       ul: 'insertUnorderedList', ol: 'insertOrderedList' };
      try {
        if (simple[cmd]) document.execCommand(simple[cmd], false, null);
        else if (cmd === 'quote') document.execCommand('formatBlock', false, 'blockquote');
        else if (cmd === 'code') {
          const sel = String(document.getSelection());
          document.execCommand('insertHTML', false, '<code>' + esc(sel || 'code') + '</code>');
        } else if (cmd === 'image') { openGallery(editable); return; }
        else if (cmd === 'news') insertBlock(editable, '%news(Council systems offline for a third day)');
        else if (cmd === 'pre') insertBlock(editable, '```SIEM export\n02:13:47  EDR  unsigned binary executed\n```');
      } catch (e) { /* execCommand is deprecated but still the only route to native undo */ }
      dressEditable(editable);
      richInput(editable);
    }

    /* ═══ INSERTING A BLOCK ═══════════════════════════════════════════════
       An artefact, a news frame and an image are blocks: TTXF.htmlToSource walks
       the editable's top-level children and only recognises them there. Dropping
       one at the caret with execCommand nested it inside whatever paragraph the
       caret was in, where the converter read it as a paragraph — so the block
       came back as flat prose and the fences were gone from the file.

       So the paragraph is split instead, and the block placed between the halves
       as a sibling. The caret lands in the paragraph after it, which is where
       someone who just inserted a log wants to carry on typing. */
    function topLevelHost(editable) {
      const sel = document.getSelection && document.getSelection();
      if (!sel || !sel.rangeCount) return null;
      const range = sel.getRangeAt(0);
      let n = range.startContainer;
      if (!editable.contains(n)) return null;
      while (n && n.parentNode && n.parentNode !== editable) n = n.parentNode;
      return n && n.parentNode === editable ? n : null;
    }

    function insertBlock(editable, source) {
      const holder = document.createElement('div');
      holder.innerHTML = TTXF.markdown(source);
      const blocks = Array.from(holder.childNodes);
      if (!blocks.length) return;

      const host = topLevelHost(editable);
      const tail = document.createElement('p');
      tail.appendChild(document.createElement('br'));

      if (!host) {                                   // no caret in the field: append
        blocks.forEach(b => editable.appendChild(b));
        editable.appendChild(tail);
      } else if (host.nodeType === 1 && /^(pre|figure|img|ul|ol|blockquote)$/i.test(host.tagName)) {
        // a block of its own: put the new one after it rather than inside it
        let at = host;
        blocks.forEach(b => { at.after(b); at = b; });
        at.after(tail);
      } else {
        // split the paragraph at the caret and sit between the halves
        const range = document.getSelection().getRangeAt(0);
        const rest = range.cloneRange();
        rest.setEnd(host, host.childNodes.length);
        const after = rest.extractContents();
        if (after.textContent.trim() || after.querySelector('img, br')) {
          tail.innerHTML = '';
          tail.appendChild(after);
          // the split lands between words; the space belonged to the sentence above
          const first = tail.firstChild;
          if (first && first.nodeType === 3) first.nodeValue = first.nodeValue.replace(/^\s+/, '');
        }
        let at = host;
        blocks.forEach(b => { at.after(b); at = b; });
        at.after(tail);
        // a paragraph emptied by the split would otherwise sit there as a blank line
        if (!host.textContent.trim() && !host.querySelector('img')) host.remove();
      }

      dressEditable(editable);
      caretInto(tail);
    }

    function caretInto(el) {
      try {
        const range = document.createRange();
        range.setStart(el, 0);
        range.collapse(true);
        const sel = document.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      } catch (e) { /* no selection to move */ }
    }

    /* ═══ QUESTIONS ═══════════════════════════════════════════════════════
       A question sits on whichever side of the stage its audience is on, and
       moving it across is how `?-` gets set. The flag stops being an obscure
       toggle and becomes the visible act of taking a question off the screen. */
    const ANSWER_PRESETS = {
      confidence5: { label: 'Confidence (5-point)',
        answers: ['Not at all confident', 'Slightly confident', 'Somewhat confident',
                  'Fairly confident', 'Completely confident'] },
      agreement5: { label: 'Agreement (5-point)',
        answers: ['Strongly disagree', 'Disagree', 'Neither agree nor disagree',
                  'Agree', 'Strongly agree'] },
      maturity4: { label: 'Maturity (4-point)',
        answers: ['Not in place', 'Partially in place', 'Mostly in place', 'Fully in place'] },
      frequency4: { label: 'Frequency (4-point)',
        answers: ['Never', 'Occasionally', 'Usually', 'Always'] },
      yesno: { label: 'Yes / No / Unsure', answers: ['Yes', 'No', 'Unsure'] },
      blank: { label: 'Write my own', answers: ['', ''] },
    };

    function questionsHTML(hidden) {
      const s = doc.stages[focus];
      const rows = s.questions
        .map((q, i) => ({ q, i }))
        .filter(({ q }) => !!q.participantHidden === hidden);
      return rows.map(({ q, i }) => {
        const scored = q.quizIndex > -1;
        const answers = q.answers.map((a, ai) => `
          <div class="b-ans${ai === q.quizIndex ? ' correct' : ''}">
            <button class="b-mark" title="${ai === q.quizIndex ? 'The correct answer' : 'Mark as the correct answer'}"
                    onclick="bMarkAnswer(${i}, ${ai})">${ai === q.quizIndex ? '✓' : ''}</button>
            <input type="text" value="${esc(a)}" placeholder="Answer"
                   aria-label="Answer ${ai + 1}"
                   oninput="bAnswer(${i}, ${ai}, this.value)">
            <button class="b-icon-btn" title="Remove answer" onclick="bRemoveAnswer(${i}, ${ai})">✕</button>
          </div>`).join('');
        return `<div class="b-q">
          <div class="b-q-top">
            <input class="b-q-text" type="text" value="${esc(q.question)}"
                   aria-label="Question ${i + 1}" placeholder="What are you asking the room?"
                   oninput="bQuestion(${i}, this.value)">
            <span class="b-q-kind${scored ? ' scored' : ''}">${scored ? 'scored' : 'poll'}</span>
            <button class="b-icon-btn" title="Delete question" onclick="bRemoveQuestion(${i})">✕</button>
          </div>
          ${answers}
          <div class="b-q-foot">
            <button class="b-add" onclick="bAddAnswer(${i})">+ Answer</button>
            <select aria-label="Replace the answers with a standard scale"
                    onchange="bPreset(${i}, this.value); this.selectedIndex = 0">
              <option value="">Preset…</option>
              ${Object.entries(ANSWER_PRESETS).map(([k, v]) => `<option value="${k}">${esc(v.label)}</option>`).join('')}
            </select>
            ${scored ? `<button class="b-add" onclick="bMarkAnswer(${i}, -1)">Clear correct answer</button>` : ''}
            <span style="flex:1"></span>
            <button class="b-add" title="${hidden ? 'Put this question on the participants’ screen' : 'Keep this question off the participants’ screen'}"
                    onclick="bMoveQuestion(${i})">${hidden ? '↑ Show to the room' : '↓ Keep private'}</button>
          </div>
        </div>`;
      }).join('');
    }

    function bQuestion(i, v) { doc.stages[focus].questions[i].question = v; touched(); }
    function bAnswer(i, ai, v) { doc.stages[focus].questions[i].answers[ai] = v; touched(); }
    function bAddAnswer(i) { doc.stages[focus].questions[i].answers.push(''); renderWork(); touched(); }

    function bRemoveAnswer(i, ai) {
      const q = doc.stages[focus].questions[i];
      q.answers.splice(ai, 1);
      // the correct answer is an index, so it has to move with the list
      if (q.quizIndex === ai) q.quizIndex = -1;
      else if (q.quizIndex > ai) q.quizIndex--;
      renderWork(); touched();
    }

    function bMarkAnswer(i, ai) {
      const q = doc.stages[focus].questions[i];
      q.quizIndex = (q.quizIndex === ai) ? -1 : ai;   // clicking the marked one clears it
      renderWork(); touched();
    }

    function bPreset(i, key) {
      const preset = ANSWER_PRESETS[key];
      if (!preset) return;
      const q = doc.stages[focus].questions[i];
      q.answers = preset.answers.slice();
      q.quizIndex = -1;                                // a rating scale has no right answer
      renderWork(); touched();
    }

    function bAddQuestion(hidden) {
      doc.stages[focus].questions.push({
        question: '', answers: ['', ''], quizIndex: -1, participantHidden: !!hidden,
      });
      renderWork(); touched();
    }

    function bRemoveQuestion(i) { doc.stages[focus].questions.splice(i, 1); renderWork(); touched(); }

    function bMoveQuestion(i) {
      const q = doc.stages[focus].questions[i];
      q.participantHidden = !q.participantHidden;
      renderWork(); touched();
    }

    /* One item is one line: the format writes it as "+ text", and a newline in
       the middle would be serialised into the file as a line with no directive
       above it — the parser drops it and everything after the break is gone. A
       text input cannot hold a newline, so the hazard cannot arise. */
    function listHTML(field, items, placeholder) {
      return items.map((v, i) => `
        <div class="b-list-item">
          <input class="b-input" type="text" value="${esc(v)}" placeholder="${esc(placeholder)}"
                 aria-label="${esc(placeholder)}, item ${i + 1}"
                 oninput="bItem('${field}', ${i}, this.value)">
          <button class="b-icon-btn" title="Remove" aria-label="Remove item ${i + 1}"
                  onclick="bRemoveItem('${field}', ${i})">✕</button>
        </div>`).join('');
    }

    function bStage(key, value) { doc.stages[focus][key] = value; touched(); }
    function bItem(field, i, value) {
      // one item, one line — see listHTML
      doc.stages[focus][field][i] = String(value).replace(/[\r\n]+/g, ' ');
      touched();
    }
    function bAddItem(field) { doc.stages[focus][field].push(''); renderWork(); touched(); }
    function bRemoveItem(field, i) { doc.stages[focus][field].splice(i, 1); renderWork(); touched(); }

    function bRemoveStage(i) {
      doc.stages.splice(i, 1);
      if (focus >= doc.stages.length) focus = Math.max(0, doc.stages.length - 1);
      renderAll();
    }

    /* ═══ SHAPES ═══
       23 of the technical scenarios follow the same arc, so offer it. */
    const SHAPES = {
      lifecycle: {
        label: 'Incident lifecycle',
        note: 'Detection through to lessons — the arc most of the library follows.',
        names: ['Detection', 'Triage and Assessment', 'Containment',
                'Eradication', 'Recovery', 'Lessons and Hardening'],
      },
      supplier: {
        label: 'Supplier / third party',
        note: 'Something reaches you through someone else’s environment.',
        names: ['External Alert', 'Internal Indicators', 'Containment',
                'Scope Assessment', 'Eradication', 'Assurance and Reconnection'],
      },
      decision: {
        label: 'Short decision exercise',
        note: 'Four stages for an hour or less, built around one hard choice.',
        names: ['Opening Situation', 'Escalation', 'Decision Point', 'Debrief'],
      },
      blank: { label: 'Blank', note: 'One empty stage.', names: [''] },
    };

    /* Offer the shape rather than impose it — but never a blank page, which is
       the thing the old builder gave everyone. */
    function bNewFromShape(which) {
      if (which && SHAPES[which]) return applyShape(which);
      metaFocus = null;
      document.getElementById('b-work-inner').innerHTML = `
        <input class="b-stage-title" type="text" value="Start a new exercise" disabled>
        <div class="b-stage-meta"><span>Pick a shape. Every stage arrives named and empty — nothing is written for you.</span></div>
        <section class="b-zone screen"><h2 class="b-zone-head">Shapes</h2><div class="b-zone-body">
          ${Object.entries(SHAPES).map(([k, v]) => `
            <div class="b-field">
              <button class="b-add" style="width:100%;text-align:left;padding:0.55rem 0.7rem"
                      onclick="applyShape('${k}')">
                <strong style="font-size:12px;color:var(--text-primary)">${esc(v.label)}</strong>
                <span style="display:block;margin-top:0.15rem;font-family:var(--font-display);font-size:11.5px">${esc(v.note)}</span>
                ${v.names[0] ? `<span style="display:block;margin-top:0.25rem;opacity:.7">${esc(v.names.join(' → '))}</span>` : ''}
              </button>
            </div>`).join('')}
        </div></section>`;
    }

    function applyShape(which) {
      const shape = SHAPES[which] || SHAPES.lifecycle;
      doc = { title: '', author: '', summary: '', conclusion: '', image: '',
              stages: shape.names.map(n => blankStage(n)) };
      focus = 0;
      metaFocus = null;
      renderAll();
    }

    /* ═══ THE MIRROR ═══════════════════════════════════════════════════════
       The participant view, embedded rather than popped out: an iframe of the
       real document floating over the workspace, the same picture-in-picture the
       gym gives a facilitator.

       The document comes from js/participant-view.js, shared with the gym, so the
       thing an author checks against is the thing the room gets. Only the panel
       chrome — drag, resize, collapse — is written here; the gym's own mirror is
       wired into its participant-state relay and was not worth unpicking. */
    const MIRROR_DEFAULT_W = 400;
    const MIRROR_MIN_W = 240;
    const MIRROR_KEY = 'ttxgym_builder_mirror';
    let mirrorOn = false;

    function mirrorPanel() { return document.getElementById('b-mirror'); }
    function mirrorFrame() { return document.getElementById('b-mirror-frame'); }

    function bToggleRoom() {
      mirrorOn = !mirrorOn;
      mirrorPanel().classList.toggle('hide', !mirrorOn);
      const btn = document.getElementById('b-room-btn');
      if (btn) btn.textContent = mirrorOn ? 'Hide participant view' : 'Participant view';
      if (mirrorOn) { mirrorMount(); sendRoom(); }
    }

    function mirrorMount() {
      const frame = mirrorFrame();
      if (!frame || frame.dataset.mounted) return;
      if (typeof PRESENTATION_HTML !== 'string') {
        failSafe('the participant view did not load — try a hard refresh');
        return;
      }
      mirrorReady = false;
      const blob = new Blob([PRESENTATION_HTML], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      frame.addEventListener('load', () => {
        try { URL.revokeObjectURL(url); } catch (e) {}
        // the document's own "ready" is the reliable signal, but if the message
        // never arrives — a blocked channel, a slow script — load is a floor
        mirrorReady = true;
        postRoom();
      }, { once: true });
      frame.src = url;
      frame.dataset.mounted = '1';
      mirrorRestore();
      mirrorInitDrag();
      mirrorInitResize();
      mirrorClamp();
    }

    function mirrorSetWidth(px, remember) {
      const max = Math.max(MIRROR_MIN_W, window.innerWidth - 60);
      const w = Math.round(Math.min(Math.max(px, MIRROR_MIN_W), max));
      const panel = mirrorPanel();
      panel.style.setProperty('--mirror-w', w + 'px');
      // CSS cannot divide by a length, so the document's scale is set alongside
      panel.style.setProperty('--mirror-scale', (w / 1280).toFixed(4));
      if (remember) mirrorRemember({ w: w });
      return w;
    }

    function mirrorWidth() {
      return parseInt(mirrorPanel().style.getPropertyValue('--mirror-w'), 10) || MIRROR_DEFAULT_W;
    }

    function mirrorSetPosition(right, bottom, remember) {
      const panel = mirrorPanel();
      panel.style.right = Math.round(right) + 'px';
      panel.style.bottom = Math.round(bottom) + 'px';
      if (remember) mirrorRemember({ right: Math.round(right), bottom: Math.round(bottom) });
    }

    function mirrorRemember(patch) {
      let saved = {};
      try { saved = JSON.parse(store.get(MIRROR_KEY) || '{}'); } catch (e) { saved = {}; }
      store.set(MIRROR_KEY, JSON.stringify(Object.assign(saved, patch)));
    }

    function mirrorRestore() {
      let saved = {};
      try { saved = JSON.parse(store.get(MIRROR_KEY) || '{}'); } catch (e) { saved = {}; }
      mirrorSetWidth(saved.w || MIRROR_DEFAULT_W, false);
      mirrorSetPosition(saved.right == null ? 20 : saved.right,
                        saved.bottom == null ? 20 : saved.bottom, false);
    }

    function mirrorReset() {
      mirrorSetWidth(MIRROR_DEFAULT_W, true);
      mirrorSetPosition(20, 20, true);
      mirrorPanel().classList.remove('collapsed');
    }

    function mirrorCollapse() {
      const panel = mirrorPanel();
      const collapsed = panel.classList.toggle('collapsed');
      const btn = document.getElementById('b-mirror-toggle');
      if (btn) { btn.textContent = collapsed ? '+' : '–'; btn.title = collapsed ? 'Expand' : 'Collapse'; }
      mirrorClamp();
    }

    /* A panel dragged near an edge and then expanded can end up off-screen with
       its own drag bar out of reach, so it is pulled back after every change. */
    function mirrorClamp() {
      const panel = mirrorPanel();
      const w = mirrorWidth();
      const h = panel.offsetHeight || 260;
      const right = parseInt(panel.style.right, 10) || 0;
      const bottom = parseInt(panel.style.bottom, 10) || 0;
      const maxRight = Math.max(0, window.innerWidth - w);
      const maxBottom = Math.max(0, window.innerHeight - h);
      mirrorSetPosition(Math.min(Math.max(right, 0), maxRight),
                        Math.min(Math.max(bottom, 0), maxBottom), false);
    }

    function mirrorDragWith(ev, onMove) {
      if (ev.preventDefault) ev.preventDefault();
      const move = e => onMove(e);
      const stop = () => {
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', stop);
        window.removeEventListener('pointercancel', stop);
        mirrorRemember({ w: mirrorWidth(),
                         right: parseInt(mirrorPanel().style.right, 10) || 0,
                         bottom: parseInt(mirrorPanel().style.bottom, 10) || 0 });
      };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', stop);
      window.addEventListener('pointercancel', stop);
    }

    function mirrorInitDrag() {
      const head = document.getElementById('b-mirror-head');
      if (!head || head.dataset.wired) return;
      head.dataset.wired = '1';
      const begin = ev => {
        if (ev.target.closest('button')) return;          // the controls are not a handle
        const panel = mirrorPanel();
        const startX = ev.clientX, startY = ev.clientY;
        const right0 = parseInt(panel.style.right, 10) || 0;
        const bottom0 = parseInt(panel.style.bottom, 10) || 0;
        mirrorDragWith(ev, e => {
          mirrorSetPosition(right0 - (e.clientX - startX), bottom0 - (e.clientY - startY), false);
          mirrorClamp();
        });
      };
      head.addEventListener('pointerdown', begin);
      head.addEventListener('mousedown', begin);
    }

    function mirrorInitResize() {
      const grip = document.getElementById('b-mirror-grip');
      if (!grip || grip.dataset.wired) return;
      grip.dataset.wired = '1';
      const begin = ev => {
        const startX = ev.clientX;
        const w0 = mirrorWidth();
        mirrorDragWith(ev, e => { mirrorSetWidth(w0 - (e.clientX - startX), false); mirrorClamp(); });
      };
      grip.addEventListener('pointerdown', begin);
      grip.addEventListener('mousedown', begin);
      grip.addEventListener('dblclick', () => mirrorReset());
      grip.addEventListener('keydown', ev => {
        const step = ev.shiftKey ? 48 : 16;
        if (ev.key === 'ArrowLeft') { mirrorSetWidth(mirrorWidth() + step, true); ev.preventDefault(); }
        else if (ev.key === 'ArrowRight') { mirrorSetWidth(mirrorWidth() - step, true); ev.preventDefault(); }
        else if (ev.key === 'Home') { mirrorReset(); ev.preventDefault(); }
      });
    }

    /* Scenario media is written relative to gym/; this page is one level up, and
       the iframe has a blob origin that can resolve neither. Absolute is the only
       thing that survives the crossing. */
    function roomAbsolute(html) {
      if (!html || html.indexOf('src=') === -1) return html;
      const holder = document.createElement('div');
      holder.innerHTML = html;
      holder.querySelectorAll('img[src]').forEach(img => {
        const raw = img.getAttribute('src');
        try { img.src = new URL(raw.replace(/^\.\.\//, ''), document.baseURI).href; } catch (e) {}
      });
      return holder.innerHTML;
    }

    /* Exactly the fields the gym puts in its payload — so what the author sees is
       what the room gets, including what it does not get. */
    function roomPayload() {
      const place = { step: focus + 1, steps: doc.stages.length };
      if (metaFocus) {
        return Object.assign({ type: 'update',
          title: metaFocus === 'summary' ? 'Before we start' : 'Debrief',
          content: roomAbsolute(TTXF.markdown(doc[metaFocus] || '')),
          discussion: [], questions: [], image: null }, { step: 0, steps: doc.stages.length });
      }
      const s = doc.stages[focus];
      if (!s) return Object.assign({ type: 'update', title: 'Nothing to show yet', content: '',
                                     discussion: [], questions: [], image: null }, place);
      return Object.assign({
        type: 'update',
        title: s.stage || 'Untitled stage',
        content: roomAbsolute(TTXF.markdown(s.content || '')),
        discussion: s.discussion.filter(d => d.trim()).map(d => roomAbsolute(TTXF.inline(d))),
        questions: s.questions
          .filter(q => !q.participantHidden && (q.question || '').trim())
          .map((q, i) => {
            const answers = q.answers.filter(a => a.trim());
            return { name: 'b' + focus + '_' + i, question: q.question, answers: answers,
                     quiz: q.quizIndex > -1, counts: answers.map(() => 0) };
          }),
        image: null,
      }, place);
    }

    /* Every edit posts the stage again, so the participant view is never showing
       something the author has moved on from.

       Two things could lose an update. A message posted before the document
       inside the iframe exists goes nowhere and nothing retries it, so sends are
       held until it says it is ready and the latest one is flushed then. And a
       burst of keystrokes would post a full re-render per character, so sends are
       coalesced into the next frame — the author still sees the current text,
       just not a re-render per keypress. */
    let mirrorReady = false;
    let roomPending = false;

    function sendRoom() {
      if (!mirrorOn) { roomPending = false; return; }
      if (roomPending) return;
      roomPending = true;
      const flush = () => {
        roomPending = false;
        postRoom();
      };
      if (typeof requestAnimationFrame === 'function') requestAnimationFrame(flush);
      else setTimeout(flush, 0);
    }

    function postRoom() {
      if (!mirrorOn || !mirrorReady) return;          // held until the document answers
      const frame = mirrorFrame();
      if (!frame || !frame.contentWindow) return;
      try { frame.contentWindow.postMessage(roomPayload(), '*'); } catch (e) { /* gone */ }
    }

    /* The document announces itself once loaded, and keeps announcing until
       something answers, so there is no delay to race. */
    window.addEventListener('message', ev => {
      if (!ev.data || ev.data.type !== 'ready') return;
      mirrorReady = true;
      postRoom();                                     // straight out, not next frame
    });

    /* ═══ PROBLEMS ════════════════════════════════════════════════════════
       The old builder reported problems against line numbers in a file the
       author never saw. Here a problem is attributed to the stage it is in and
       clicking it goes there — the only form of the information that leads to a
       fix rather than a hunt. */
    let problemsOpen = false;

    /* The model is serialised to be checked, so the parser's line numbers point
       into text nobody is looking at; every "@ " line marks the start of a stage
       and turns that line number back into a stage. */
    function problems() {
      const text = toTTXF();
      const { errors } = TTXF.parse(text);
      const starts = [];
      text.split('\n').forEach((l, i) => { if (/^@\s/.test(l)) starts.push(i + 1); });
      return errors.map(e => {
        let i = -1;
        for (let n = 0; n < starts.length; n++) if (e.line >= starts[n]) i = n;
        return { message: e.message, severity: e.severity, stage: i };
      });
    }

    function status() {
      const el = document.getElementById('b-status');
      const all = problems();
      const bad = all.filter(p => p.severity === 'error').length;
      const warn = all.length - bad;
      if (bad) { el.textContent = bad + ' problem' + (bad > 1 ? 's' : ''); el.className = 'bad'; }
      else if (warn) { el.textContent = warn + ' to check'; el.className = ''; }
      else { el.textContent = 'ready'; el.className = 'good'; }
      el.title = all.length ? 'Show what needs attention' : 'Nothing to fix';
      if (problemsOpen) renderProblems();
    }

    function toggleProblems() { problemsOpen = !problemsOpen; renderProblems(); }

    function renderProblems() {
      const panel = document.getElementById('b-problems');
      const all = problems();
      document.getElementById('b-status').setAttribute('aria-expanded', String(problemsOpen));
      panel.classList.toggle('hide', !problemsOpen);
      if (!problemsOpen) return;
      if (!all.length) { panel.innerHTML = '<div class="b-gal-empty">Nothing to fix.</div>'; return; }
      panel.innerHTML = all.map(p => {
        const where = p.stage > -1
          ? 'Stage ' + (p.stage + 1) + ' · ' + ((doc.stages[p.stage] || {}).stage || 'Untitled')
          : 'The exercise as a whole';
        return `<button type="button" class="b-problem${p.severity === 'error' ? ' err' : ''}"
                  onclick="goToProblem(${p.stage})">
                  <span class="where">${esc(where)}</span>${esc(p.message)}</button>`;
      }).join('');
    }

    function goToProblem(i) {
      problemsOpen = false;
      renderProblems();
      if (i > -1 && doc.stages[i]) bFocus(i);
    }

    /* ═══ GALLERY ═════════════════════════════════════════════════════════
       Scenario media is authored relative to gym/, and this page sits one level
       up at the site root. Served from a domain root the difference is invisible
       — ".." past the root is clamped — but from file:// or a project subpath
       "../lib/…" escapes the site and the picture breaks. The authored path is
       kept in data-src, which TTXF.htmlToSource prefers, so what gets displayed
       and what gets written to the file can differ without either being wrong. */
    const GALLERY_DIR = 'lib/exercise_data/';        // from this page
    const GALLERY_AUTHORED = '../lib/exercise_data/'; // from gym/, where it is played
    let galleryData = null;
    let galleryTab = null;
    let galleryTarget = null;
    let coverPick = false;

    function mediaDisplay(root) {
      if (!root || !root.querySelectorAll) return;
      root.querySelectorAll('img.SFmedia').forEach(img => {
        const raw = img.getAttribute('data-src') || img.getAttribute('src') || '';
        if (/^([a-z][a-z0-9+.-]*:|\/\/|\/|#)/i.test(raw)) return;   // absolute already
        img.setAttribute('data-src', raw);
        img.setAttribute('src', raw.replace(/^(\.\.\/)+/, ''));
      });
    }

    /* Opening a dialog and leaving the focus behind it strands anyone on a
       keyboard: tab order carries on through the page underneath, and Escape is
       the only way out they can find by accident. */
    let galleryReturn = null;

    function openGallery(editable) {
      galleryTarget = editable;
      galleryReturn = document.activeElement;
      document.getElementById('b-gallery').classList.remove('hide');
      document.getElementById('b-gal-url').value = '';
      const first = document.querySelector('#b-gallery .b-modal-head button');
      if (first && first.focus) first.focus();
      if (galleryData) return renderGallery();
      fetch(GALLERY_DIR + 'gallery.json')
        .then(r => (r.ok ? r.json() : null))
        .then(d => { galleryData = d && d.images ? d : { categories: [], images: [] }; renderGallery(); })
        .catch(() => { galleryData = { categories: [], images: [] }; renderGallery(); });
    }

    function closeGallery() {
      document.getElementById('b-gallery').classList.add('hide');
      galleryTarget = null;
      if (galleryReturn && galleryReturn.focus) galleryReturn.focus();
      galleryReturn = null;
    }

    function cancelGallery() { coverPick = false; closeGallery(); }

    function renderGallery() {
      const tabs = document.getElementById('b-gal-tabs');
      const grid = document.getElementById('b-gal-grid');
      const note = document.getElementById('b-gal-note');
      note.hidden = true;
      const cats = (galleryData && galleryData.categories) || [];
      const images = (galleryData && galleryData.images) || [];

      if (!cats.length && !images.length) {
        tabs.innerHTML = '';
        grid.innerHTML = '<div class="b-gal-empty">No gallery found — paste a URL below.</div>';
        return;
      }

      // open on a category that has something in it, never on an empty panel
      if (!galleryTab || !cats.some(c => c.name === galleryTab)) {
        galleryTab = (cats.find(c => images.some(i => i.category === c.name)) || cats[0]).name;
      }

      tabs.innerHTML = cats.map(c => {
        const n = images.filter(i => i.category === c.name).length;
        return `<button type="button" role="tab" aria-selected="${c.name === galleryTab}"
                  onclick="galleryPick('${esc(c.name)}')">${esc(c.heading)}<span class="count">${n}</span></button>`;
      }).join('');

      const items = images.filter(i => i.category === galleryTab);
      if (!items.length) {
        grid.innerHTML = `<div class="b-gal-empty">Nothing here yet — drop images into ` +
                         `<code>lib/exercise_data/${esc(galleryTab)}/</code> and run the build.</div>`;
        return;
      }
      grid.innerHTML = items.map(i => {
        // each segment separately: encoding the whole path would turn "/" into %2F
        const src = GALLERY_DIR + i.file.split('/').map(encodeURIComponent).join('/');
        const label = esc(i.label + (i.variant ? ' (' + i.variant + ')' : ''));
        const owed = /^CC BY/i.test(i.licence || '');
        const credit = i.licence
          ? `<span class="credit">${owed ? '<b>' + esc(i.licence) + '</b> · ' : ''}${esc(i.author || '')}</span>`
          : '';
        const tip = i.licence ? `${i.file} — ${i.licence}${i.author ? ', ' + i.author : ''}` : i.file;
        return `<button type="button" class="b-gal-item" title="${esc(tip)}"
                  onclick="insertGalleryImage('${esc(i.file).replace(/'/g, "\\'")}')">
                  <img src="${src}" alt="" loading="lazy">
                  <span class="name">${label}</span>${credit}</button>`;
      }).join('');

      const owing = items.filter(i => /^CC BY/i.test(i.licence || ''));
      note.innerHTML = owing.length
        ? `${owing.length} of these carry a licence that asks for a credit — shown in amber, and listed in `
          + `<a href="${GALLERY_DIR}${esc(galleryTab)}/CREDITS.md" target="_blank" rel="noopener">CREDITS.md</a>. `
          + 'Name the photographer and the licence wherever you would credit a slide.'
        : 'Everything here is public domain or CC0: no credit required.';
      note.hidden = !items.length;
    }

    function galleryPick(name) { galleryTab = name; renderGallery(); }

    function galleryScale() { return document.getElementById('b-gal-scale').value || '60%'; }

    function insertGalleryImage(file) { insertMedia(GALLERY_AUTHORED + file); }

    function insertGalleryURL() {
      const url = document.getElementById('b-gal-url').value.trim();
      if (url) insertMedia(url);
    }

    function insertMedia(url) {
      const editable = galleryTarget;
      const scale = galleryScale();
      closeGallery();
      if (coverPick) return setCover(url);
      if (!editable) return;
      editable.focus();
      insertBlock(editable, '%(' + url + ' | ' + scale + ')');
      richInput(editable);
    }

    /* ═══ IMPORT / EXPORT ══════════════════════════════════════════════════
       A file can arrive through the button or by being dropped anywhere on the
       page. Either way it is parsed before it is accepted: a file with nothing
       the format recognises is refused rather than silently replacing an hour of
       work with an empty scenario, and a file that parses with complaints opens
       the problems list so they are seen now rather than in front of a room. */
    function bImportPrompt() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.ttxf,.txt';
      input.onchange = e => { const f = e.target.files && e.target.files[0]; if (f) openFile(f); };
      input.click();
    }

    function hasWork() {
      return !!(doc.title || doc.summary || doc.conclusion ||
                doc.stages.some(s => s.stage || s.content));
    }

    function openFile(file) {
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) { failSafe('that file is too large to be a scenario'); return; }
      const r = new FileReader();
      r.onerror = () => failSafe('could not read ' + file.name);
      r.onload = () => importText(String(r.result), file.name);
      r.readAsText(file);
    }

    function importText(text, name) {
      const label = name ? '"' + name + '"' : 'that file';
      const { doc: parsed } = TTXF.parse(text);
      if (!parsed.stages || !parsed.stages.length) {
        failSafe('nothing in ' + label + ' looks like a scenario — no "@ " stages found');
        return;
      }
      if (hasWork() && !confirm('Open ' + label + '? This replaces what is in the builder.')) return;
      load(text);
      const bad = problems();
      if (bad.length) { problemsOpen = true; renderProblems(); }
    }

    /* ?load=<id> is the library's Customise button. It arrives with intent, so
       it wins over whatever draft is in the browser — but only once it has
       actually landed, so a failed fetch leaves the draft alone. */
    function loadFromLibrary(id) {
      const safe = String(id).replace(/[^a-z0-9_-]/gi, '');
      if (!safe) return Promise.resolve(false);
      return fetch('lib/scenarios/' + safe + '.ttxf')
        .then(r => { if (!r.ok) throw new Error(r.statusText); return r.text(); })
        .then(text => { load(text); dismissNotice(); return true; })
        .catch(() => {
          failSafe('could not load "' + safe + '" from the library — try Import instead');
          return false;
        });
    }

    /* Handing the scenario to the gym. The gym reads it out of localStorage and
       clears the key, so nothing is left lying about for the next session. */
    function bRunInGym() {
      if (!doc.stages.length) { failSafe('there is nothing to run yet'); return; }
      if (!store.set('preview', toTTXF())) { failSafe('could not hand the scenario to the gym'); return; }
      window.open('gym/', '_blank');
    }

    /* The cover image is the one piece of media that is not inside a stage — it
       is the scenario's own, shown on the way in. */
    function bPickCover() {
      coverPick = true;
      openGallery(null);
    }

    function setCover(url) {
      doc.image = url || '';
      coverPick = false;
      renderOutline();
      touched();
    }

    /* ═══ THE DRAFT ═══════════════════════════════════════════════════════
       Work is saved continuously, which means an author can arrive to find
       someone else's half-finished scenario with no explanation. Say where it
       came from, and offer the way out. */
    function showDraftNotice(text) {
      document.getElementById('b-notice-text').textContent = text;
      document.getElementById('b-notice').classList.remove('hide');
    }

    function dismissNotice() { document.getElementById('b-notice').classList.add('hide'); }

    function bDiscardDraft() {
      if (hasWork() && !confirm('Start again? What is in the builder will be discarded.')) return;
      store.del(DRAFT_KEY);
      doc = { title: '', author: '', summary: '', conclusion: '', image: '', stages: [] };
      focus = 0;
      metaFocus = null;
      dismissNotice();
      renderAll();
      bNewFromShape();
    }

    /* The drop target is the whole page, because guessing where to aim is the
       kind of small friction this rebuild exists to remove. */
    function initDrop() {
      const veil = document.getElementById('b-drop');
      let depth = 0;
      const carries = ev => Array.prototype.some.call((ev.dataTransfer || {}).types || [],
                                                      t => t === 'Files');
      window.addEventListener('dragenter', ev => {
        if (!carries(ev)) return;
        depth++; veil.classList.remove('hide'); ev.preventDefault();
      });
      window.addEventListener('dragover', ev => { if (carries(ev)) ev.preventDefault(); });
      window.addEventListener('dragleave', () => {
        depth = Math.max(0, depth - 1);
        if (!depth) veil.classList.add('hide');
      });
      window.addEventListener('drop', ev => {
        if (!carries(ev)) return;
        ev.preventDefault();
        depth = 0; veil.classList.add('hide');
        const f = ev.dataTransfer.files && ev.dataTransfer.files[0];
        if (f) openFile(f);
      });
    }

    function bExport() {
      const name = (doc.title || 'scenario').toLowerCase()
        .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'scenario';
      const blob = new Blob([toTTXF()], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name + '.ttxf';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }

    function renderAll() { renderOutline(); renderWork(); sendRoom(); status(); clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); }

    /* ═══ START ═══ everything runs from here, at the bottom, so nothing is
       referenced before it is defined. */
    /* The builder this page replaced saved under its own key, wrapped in an
       envelope and with an id on every stage. Anyone who had unfinished work open
       on the day of the swap would otherwise arrive to an empty page with their
       scenario still in the browser and no way to reach it, so it is adopted once
       and then the old key is released. */
    const OLD_DRAFT_KEY = 'ttxgym_editor_draft';

    function adoptOldDraft() {
      const raw = store.get(OLD_DRAFT_KEY);
      if (!raw) return false;
      let old = null;
      try { old = JSON.parse(raw); } catch (e) { return false; }
      const d = old && old.doc ? old.doc : old;
      if (!d || !Array.isArray(d.stages)) return false;
      doc = {
        title: d.title || '', author: d.author || '', image: d.image || '',
        summary: d.summary || '', conclusion: d.conclusion || '',
        stages: d.stages.map(s => ({
          stage: s.stage || '', content: s.content || '', duration: s.duration || '',
          discussion: (s.discussion || []).slice(),
          prompts: (s.prompts || []).slice(),
          questions: (s.questions || []).map(q => ({
            question: q.question || '', answers: (q.answers || []).slice(),
            quizIndex: typeof q.quizIndex === 'number' ? q.quizIndex : -1,
            participantHidden: !!q.participantHidden,
          })),
        })),
      };
      save();                                  // in the new key before the old one goes
      store.del(OLD_DRAFT_KEY);
      return true;
    }

    function start() {
      const draft = store.get(DRAFT_KEY);
      let restored = false;
      let adopted = false;
      if (draft) {
        try { doc = JSON.parse(draft); restored = true; } catch (e) { /* fall through to empty */ }
      } else {
        adopted = adoptOldDraft();
        restored = adopted;
      }
      if (!doc.stages) doc.stages = [];
      renderAll();
      initDrop();
      initOutlineDrag();
      initBlockTools();

      let param = '';
      try { param = new URLSearchParams(window.location.search).get('load') || ''; } catch (e) { param = ''; }
      if (param) loadFromLibrary(param);
      else if (restored && hasWork()) {
        showDraftNotice(adopted
          ? 'Brought across from the previous builder' +
            (doc.title ? ': "' + doc.title + '"' : '') + '. Everything came with it.'
          : 'Picked up where you left off' +
            (doc.title ? ' on "' + doc.title + '"' : '') + '.');
      } else if (!doc.stages.length) {
        bNewFromShape();
      }
      window.addEventListener('resize', () => { if (mirrorOn) mirrorClamp(); });
      // clicking away closes the transient surfaces; Escape does too
      document.addEventListener('click', ev => {
        if (problemsOpen && !(ev.target.closest && ev.target.closest('#b-problems, #b-status'))) {
          problemsOpen = false; renderProblems();
        }
      });
      document.addEventListener('keydown', ev => {
        const gallery = document.getElementById('b-gallery');
        const open = !gallery.classList.contains('hide');
        if (ev.key === 'Escape') {
          if (open) cancelGallery();
          else if (problemsOpen) { problemsOpen = false; renderProblems(); }
          return;
        }
        if (ev.key !== 'Tab' || !open) return;
        const stops = Array.from(gallery.querySelectorAll('button, input, select, [tabindex="0"]'))
          .filter(el => !el.disabled && el.offsetParent !== null);
        if (!stops.length) return;
        const first = stops[0], last = stops[stops.length - 1];
        if (ev.shiftKey && document.activeElement === first) { last.focus(); ev.preventDefault(); }
        else if (!ev.shiftKey && document.activeElement === last) { first.focus(); ev.preventDefault(); }
      });
      window.addEventListener('beforeunload', save);
    }
    start();
  </script>
</body>

</html>
